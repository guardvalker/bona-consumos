<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>bonapp-gastos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e1e2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bonapp-gastos">
<meta name="mobile-web-app-capable" content="yes">
<script>
  (function() {
    try {
      var t = localStorage.getItem('bona_consumos_theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      var p = localStorage.getItem('bona_consumos_palette');
      document.documentElement.setAttribute('data-accent', p || 'blue');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --ctp-red: #f38ba8;
    --ctp-peach: #fab387;
    --ctp-yellow: #f9e2af;
    --ctp-green: #a6e3a1;
    --ctp-teal: #94e2d5;
    --ctp-blue: #89b4fa;
    --ctp-mauve: #cba6f7;
    --ctp-pink: #f5c2e7;
    --ctp-sky: #89dceb;
    --ctp-lavender: #b4befe;

    --bg: #1e1e2e;
    --card: #313244;
    --card-2: #45475a;
    --border: #45475a;
    --text: #cdd6f4;
    --text-dim: #a6adc8;
    --accent: var(--ctp-blue);
    --accent-dim: color-mix(in srgb, var(--accent) 18%, var(--bg));
    --positive: var(--ctp-green);
    --negative: var(--ctp-red);
    --on-accent: #1e1e2e;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  :root[data-theme="light"] {
    --ctp-red: #d20f39;
    --ctp-peach: #fe640b;
    --ctp-yellow: #df8e1d;
    --ctp-green: #40a02b;
    --ctp-teal: #179299;
    --ctp-blue: #1e66f5;
    --ctp-mauve: #8839ef;
    --ctp-pink: #ea76cb;
    --ctp-sky: #04a5e5;
    --ctp-lavender: #7287fd;

    --bg: #eff1f5;
    --card: #ffffff;
    --card-2: #e6e9ef;
    --border: #ccd0da;
    --text: #4c4f69;
    --text-dim: #6c6f85;
    --accent: var(--ctp-blue);
    --accent-dim: color-mix(in srgb, var(--accent) 10%, var(--bg));
    --positive: var(--ctp-green);
    --negative: var(--ctp-red);
    --on-accent: #ffffff;
    --shadow: 0 8px 24px rgba(76,79,105,0.12);
  }

  /* Paleta de acento rotable (botón pincel en Ajustes) — recorre hues de
     Catppuccin manteniendo rojo/verde reservados para saldos +/-. Va después
     de los bloques de tema (misma especificidad que :root[data-theme]) para
     que gane el empate y funcione tanto en claro como en oscuro. */
  :root[data-accent="mauve"] { --accent: var(--ctp-mauve); }
  :root[data-accent="pink"] { --accent: var(--ctp-pink); }
  :root[data-accent="peach"] { --accent: var(--ctp-peach); }
  :root[data-accent="teal"] { --accent: var(--ctp-teal); }
  :root[data-accent="sky"] { --accent: var(--ctp-sky); }
  :root[data-accent="lavender"] { --accent: var(--ctp-lavender); }
  :root[data-accent="yellow"] { --accent: var(--ctp-yellow); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button, input, select, textarea { font-family: inherit; }
  button { touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer; }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 1rem 1rem 6rem;
    /* En iOS instalada como PWA (status bar "black-translucent" +
       viewport-fit=cover), el contenido arranca debajo del notch/batería si
       no se le suma el safe-area-inset-top acá — el max() mantiene el
       padding de 1rem normal en Android/desktop, donde ese inset es 0. */
    padding-top: max(1rem, env(safe-area-inset-top));
    padding-left: max(1rem, env(safe-area-inset-left));
    padding-right: max(1rem, env(safe-area-inset-right));
  }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.5rem; margin-bottom: 1.25rem;
  }
  .top-bar h1 { font-size: 1.25rem; margin: 0; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .group-switch-btn {
    width: auto; padding: 0 0.9rem 0 1rem; gap: 0.45rem;
    font-size: 1rem; font-weight: 600; max-width: 75%;
  }
  .group-switch-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-switch-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    border: none; border-radius: 14px; padding: 0.85rem 1.1rem;
    font-size: 0.98rem; font-weight: 600;
  }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .btn-primary { background: var(--accent); color: var(--on-accent); width: 100%; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); width: 100%; }
  .btn-danger { background: transparent; color: var(--negative); border: 1px solid var(--negative); width: 100%; }
  .btn-block-row { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    border-left: 3px solid var(--accent);
    padding: 1rem; margin-bottom: 0.75rem;
  }

  input[type="text"], input[type="email"], input[type="date"], select, textarea {
    width: 100%; background: var(--card-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem 0.8rem;
    font-size: 1rem; margin-top: 0.3rem;
  }
  textarea { resize: vertical; min-height: 3rem; }

  /* El texto de <input type="date"> lo formatea el idioma/región del
     navegador, no el lang="es-AR" de la página — así que puede salir en
     formato USA aunque el resto de la app esté en español. Se lo oculta
     (color transparent) y se superpone un span con formatFecha() en
     dd/mm/aa; el input sigue debajo intacto para abrir el picker nativo. */
  .date-field { position: relative; margin-top: 0.3rem; }
  .date-field input[type="date"] { margin-top: 0; color: transparent; }
  .date-field .date-overlay {
    position: absolute; inset: 0; display: flex; align-items: center;
    padding: 0 0.8rem; font-size: 1rem; color: var(--text); pointer-events: none;
  }
  label { font-size: 0.82rem; color: var(--text-dim); display: block; margin-top: 0.85rem; }
  label:first-child { margin-top: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.4rem; }
  .chip {
    background: var(--card-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 999px; padding: 0.45rem 0.9rem; font-size: 0.85rem;
    display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .chip.active { background: var(--cat-tint, var(--accent-dim)); border-color: var(--cat-color, var(--accent)); color: var(--cat-color, var(--accent)); font-weight: 600; }
  .chip svg { width: 15px; height: 15px; color: var(--cat-color, currentColor); }

  .empty-state { text-align: center; color: var(--text-dim); padding: 2.5rem 1rem; font-size: 0.92rem; }
  .stat-range-custom { display: flex; gap: 0.6rem; margin-top: 0.6rem; }
  .stat-range-custom > div { flex: 1; min-width: 0; }
  .stat-range-custom input { width: 100%; }

  .grupo-card {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 1rem; margin-bottom: 0.75rem;
  }
  .grupo-card .nombre { font-weight: 600; font-size: 1.02rem; }
  .balance-tag { font-weight: 700; font-size: 0.98rem; }
  .balance-tag.pos { color: var(--positive); }
  .balance-tag.neg { color: var(--negative); }
  .balance-tag.zero { color: var(--text-dim); }

  .balance-hero {
    text-align: center; padding: 1.25rem 1rem 1.5rem;
  }
  .balance-hero .label { color: var(--text-dim); font-size: 0.85rem; }
  .balance-hero .amount { font-size: 2.1rem; font-weight: 700; margin-top: 0.25rem; }
  .balance-hero .amount.pos { color: var(--positive); }
  .balance-hero .amount.neg { color: var(--negative); }
  .balance-hero .amount.zero { color: var(--text-dim); }

  .debt-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.65rem 0; border-bottom: 1px dashed var(--border);
    gap: 0.5rem;
  }
  .debt-row:last-child { border-bottom: none; }
  .debt-row .txt { font-size: 0.9rem; }
  .debt-row .txt b { color: var(--text); }
  .debt-row button {
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 0.4rem 0.7rem; font-size: 0.78rem; white-space: nowrap;
  }

  .section-title {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); margin: 1.4rem 0 0.5rem;
    border-left: 3px solid var(--accent); padding-left: 0.5rem;
  }

  .gasto-row {
    display: flex; align-items: center; gap: 0.7rem;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    border-left: 4px solid var(--payer-color, var(--border));
    padding: 0.75rem 0.85rem; margin-bottom: 0.55rem;
  }
  .gasto-row .cat-icon {
    width: 38px; height: 38px; border-radius: 10px; background: var(--cat-tint, var(--card-2));
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .gasto-row .cat-icon svg { width: 19px; height: 19px; color: var(--cat-color, var(--accent)); }
  .gasto-row .mid { flex: 1; min-width: 0; }
  .gasto-row .desc { font-weight: 600; font-size: 0.94rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gasto-row .meta { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.15rem; display: flex; align-items: center; gap: 0.35rem; }
  .payer-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--payer-color, var(--text-dim)); flex-shrink: 0; }
  .gasto-row .monto { font-weight: 700; font-size: 0.94rem; text-align: right; white-space: nowrap; }
  .gasto-row .monto small { display: block; font-weight: 400; color: var(--text-dim); font-size: 0.7rem; }

  .gasto-row.pago .cat-icon { background: color-mix(in srgb, var(--ctp-green) 16%, var(--card)); }
  .gasto-row.pago .cat-icon svg { color: var(--ctp-green); }
  .gasto-row.pago .monto { color: var(--ctp-green); }
  .gasto-row[data-edit-gasto] { cursor: pointer; }

  .filter-bar {
    display: flex; align-items: center; gap: 0.6rem;
    background: var(--card-2); border: 1px solid var(--border); border-radius: 12px;
    border-left: 3px solid var(--cat-color, var(--accent));
    padding: 0 0.8rem; margin-top: 0.4rem;
  }
  .filter-bar > svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--cat-color, var(--accent)); }
  .filter-bar select {
    border: none; background: transparent; margin-top: 0; padding: 0.7rem 0;
    font-size: 0.95rem; font-weight: 600; flex: 1; min-width: 0;
    outline: none; /* al cerrar la lista tocando afuera el select queda enfocado y dibujaba un aro encima del texto */
  }

  .category-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-top: 0.4rem;
  }
  .category-tile {
    aspect-ratio: 1; background: var(--card-2); border: 1px solid var(--border);
    border-radius: 14px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 0.4rem; color: var(--text-dim); padding: 0.5rem;
  }
  .category-tile.active { background: var(--cat-tint, var(--accent-dim)); border-color: var(--cat-color, var(--accent)); color: var(--cat-color, var(--accent)); }
  .category-tile svg { width: 24px; height: 24px; color: var(--cat-color, currentColor); }
  .category-tile span { font-size: 0.78rem; font-weight: 600; text-align: center; line-height: 1.2; }

  .icon-picker-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.45rem; margin-top: 0.4rem;
  }
  .icon-picker-tile {
    aspect-ratio: 1; background: var(--card-2); border: 1px solid var(--border);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
  }
  .icon-picker-tile.active { background: var(--cat-tint, var(--accent-dim)); border-color: var(--cat-color, var(--accent)); color: var(--cat-color, var(--accent)); }
  .icon-picker-tile svg { width: 18px; height: 18px; color: var(--cat-color, currentColor); }

  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(1.25rem, calc(env(safe-area-inset-bottom) + 0.5rem));
    width: min(420px, calc(100% - 2rem));
    z-index: 5;
  }
  .fab .btn-primary { box-shadow: var(--shadow); }

  .overlay-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; z-index: 10;
  }
  .overlay-backdrop.open { display: block; }
  .overlay-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 90vh;
    background: var(--bg); border-radius: 20px 20px 0 0;
    border-top: 3px solid var(--accent);
    padding: 1rem 1.1rem calc(1.5rem + env(safe-area-inset-bottom));
    overflow-y: auto; z-index: 11;
    transform: translateY(100%); transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .overlay-sheet.open { transform: translateY(0); }
  .overlay-sheet-inner { max-width: 480px; margin: 0 auto; }
  .sheet-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem; padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--accent-dim);
  }
  .sheet-header h2 { font-size: 1.1rem; margin: 0; }

  .participant-row {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .participant-row:last-child { border-bottom: none; }
  .participant-row .pname { flex: 1; font-size: 0.9rem; }
  .participant-row .pmonto { font-size: 0.85rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .participant-row input[type="checkbox"] { width: 18px; height: 18px; }
  .participant-row input[type="text"] { width: 90px; margin: 0; text-align: right; }

  .split-sum-hint { font-size: 0.8rem; margin-top: 0.5rem; text-align: right; }
  .split-sum-hint.ok { color: var(--positive); }
  .split-sum-hint.bad { color: var(--negative); }

  .field-error { color: var(--negative); font-size: 0.82rem; margin-top: 0.5rem; }
  .muted-link { background: none; border: none; color: var(--accent); font-size: 0.85rem; padding: 0.4rem 0; }

  .auth-wrap { padding-top: 3rem; text-align: center; }
  .auth-wrap h1 { font-size: 1.6rem; letter-spacing: 0.02em; margin-bottom: 0.25rem; }
  .auth-wrap p.tagline { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 2rem; }
  .auth-wrap .card { text-align: left; }

  .row-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 0.6rem; }

  .share-link-box {
    display: flex; gap: 0.5rem; align-items: center; margin-top: 0.4rem;
  }
  .share-link-box input { flex: 1; font-size: 0.82rem; }
  .share-link-box button { flex-shrink: 0; }

  .member-line { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed var(--border); font-size: 0.9rem; }
  .member-line:last-child { border-bottom: none; }

  .app-info { text-align: center; margin-bottom: 1.5rem; }
  .app-name { font-weight: 700; font-size: 1.7rem; }
  .version-row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.4rem; }
  .version-btn {
    background: none; border: none; color: var(--ctp-mauve); font-size: 0.85rem;
    font-weight: 600; padding: 0.2rem 0.3rem; text-decoration: underline dotted;
  }
  .update-btn { width: 28px; height: 28px; opacity: 0.65; }
  .update-btn svg { width: 14px; height: 14px; }

  .version-list { max-height: 55vh; overflow-y: auto; }
  .version-entry { padding: 0.85rem 0; border-bottom: 1px dashed var(--border); }
  .version-entry:last-child { border-bottom: none; }
  .version-entry-header { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.94rem; margin-bottom: 0.4rem; }
  .version-entry-header span { color: var(--text-dim); font-size: 0.78rem; }
  .version-entry ul { margin: 0; padding-left: 1.1rem; font-size: 0.85rem; color: var(--text-dim); }
  .version-entry li { margin-bottom: 0.25rem; }

  .stat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.55rem 0; border-bottom: 1px dashed var(--border); font-size: 0.88rem;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { display: flex; align-items: center; gap: 0.45rem; }
  .stat-icon { width: 16px; height: 16px; color: var(--cat-color, var(--text-dim)); flex-shrink: 0; }
  .stat-value { font-weight: 600; white-space: nowrap; }
  .stat-value small { font-weight: 400; color: var(--text-dim); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(1.25rem, calc(env(safe-area-inset-bottom) + 0.5rem));
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    padding: 0.7rem 1.1rem; border-radius: 12px; font-size: 0.85rem; z-index: 20;
    box-shadow: var(--shadow);
    animation: toastIn 0.25s ease-out;
  }
  .toast.toast-out { animation: toastOut 0.35s ease-in forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(14px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }

  /* ---- Animaciones: categoría elegida, guardar gasto, marcar pagado ---- */
  .category-tile {
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .category-tile:active { transform: scale(0.92); }
  .category-tile.active { animation: catPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes catPop {
    0% { transform: scale(0.82); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .success-burst {
    position: fixed; top: 50%; left: 50%; z-index: 30; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--positive); color: var(--bg);
    transform: translate(-50%, -50%) scale(0.4); opacity: 0;
    animation: burstPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .success-burst svg { width: 42px; height: 42px; }
  .success-burst.coins { background: var(--ctp-yellow); font-size: 2.2rem; }
  @keyframes burstPop {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* ---- Easter egg: el honguito que se asoma de costado ----
     Quieto por defecto (nada de wiggle idle) — solo se mueve cuando lo tocan,
     así queda como un detalle escondido y no un elemento más de la UI. */
  .mushroom-peek {
    position: fixed; top: 46%; right: -30px; width: 40px; height: 40px;
    z-index: 6; cursor: pointer; touch-action: manipulation;
    transition: right 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0.85;
  }
  .mushroom-peek.peeking { right: 6px; }
  .mushroom-peek img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .mushroom-peek.happy img { animation: mushroomHappy 0.7s ease-in-out; }
  @keyframes mushroomHappy {
    0% { transform: scale(1) rotate(0deg); }
    40% { transform: scale(1.3) rotate(-14deg) translateY(-10px); }
    70% { transform: scale(1.1) rotate(10deg) translateY(-3px); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .mushroom-peek.sad img { animation: mushroomSad 0.45s ease-in-out 3; filter: grayscale(0.7) brightness(0.85); }
  @keyframes mushroomSad {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25% { transform: rotate(-10deg) translateY(2px); }
    75% { transform: rotate(10deg) translateY(2px); }
  }
  .money-drop, .tear-drop {
    position: fixed; top: -40px; pointer-events: none; z-index: 401; line-height: 1;
  }

  // Set fijo de íconos generados (sin emoji): las 5 categorías predefinidas
  // usan claves puntuales (CATEGORY_ICON_KEY), y el resto queda disponible
  // como opciones para el picker al crear una categoría custom — el picker
  // no muestra nombres (ver renderNuevaCategoriaOverlay: el nombre lo define
  // lo que la persona tipea, no el ícono) y filtra los íconos que ya están
  // en uso por otra categoría del grupo.
  const ICON_LIBRARY = {
    fork: '<path d="M6 2v7a2 2 0 0 0 2 2v11M6 2v9M10 2v9M10 2v20M18 2c-2.2 0-4 3.6-4 8s1.8 8 4 8 4-3.6 4-8-1.8-8-4-8z"/>',

    plane: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>',
    wrench: '<path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4l-3.4 3.4-2-2 3.4-3.4z"/>',
    coffee: '<path d="M4 9h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M7 2c0 1-1 1-1 2s1 1 1 2M11 2c0 1-1 1-1 2s1 1 1 2"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',

    briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M2 13h20"/>',

  const ICON_PICKER_KEYS = [
    'cat', 'dog', 'coffee', 'book', 'music', 'gamepad', 'dumbbell', 'briefcase', 'baby', 'phone', 'camera',
    'home', 'gift', 'heart', 'plane', 'wrench', 'cart', 'fork', 'receipt', 'bus', 'dots',
  ];
  const CATEGORY_ICON_KEY = { Salidas: 'fork', Super: 'cart', Servicios: 'receipt', Transporte: 'bus', Gatitas: 'cat' };

  // Un color fijo de Catppuccin por ícono (no un hash) — así categorías
  // custom con el mismo ícono siempre coinciden en color, y el color viaja
  // solo con el ícono elegido, no con la posición en ninguna lista. Las 5
  // categorías predefinidas tienen cada una un color distinto entre sí; el
  // resto de los íconos reciclan esos mismos 10 tonos de Catppuccin (no hay
  // más matices que esos), la forma del ícono sigue siendo lo que las
  // distingue.
  const ICON_KEY_COLOR = {
    fork: '--ctp-peach', cart: '--ctp-green', receipt: '--ctp-yellow', bus: '--ctp-sky', cat: '--ctp-mauve',
    home: '--ctp-lavender', gift: '--ctp-pink', heart: '--ctp-red', plane: '--ctp-teal', wrench: '--ctp-blue',
    dog: '--ctp-peach', coffee: '--ctp-yellow', book: '--ctp-mauve', music: '--ctp-pink', gamepad: '--ctp-teal',
    dumbbell: '--ctp-red', briefcase: '--ctp-blue', baby: '--ctp-sky', phone: '--ctp-green', camera: '--ctp-lavender',
    dots: '--ctp-lavender',
  };

  function iconKeyFor(categoriaNombre) {
    if (CATEGORY_ICON_KEY[categoriaNombre]) return CATEGORY_ICON_KEY[categoriaNombre];
    const custom = categoriasCustom.find((c) => c.nombre === categoriaNombre);
    if (custom && custom.icono && ICON_LIBRARY[custom.icono]) return custom.icono;
    return 'dots';
  }

  // Íconos ya usados por alguna categoría del grupo (predefinidas + custom)
  // — el picker de "nueva categoría" los excluye para no repetir.
  function iconKeysEnUso() {
    return new Set(todasCategorias().map((c) => iconKeyFor(c)));
  }

  // Variables CSS (--cat-color sólido, --cat-tint de fondo suave mezclado
  // con la superficie de la tarjeta) para pintar un elemento puntual con el
  // color de una categoría/ícono sin tocar el resto de la paleta neutra.
  function iconKeyColorStyle(key) {
    const v = ICON_KEY_COLOR[key] || '--ctp-lavender';
    return `--cat-color:var(${v}); --cat-tint:color-mix(in srgb, var(${v}) 18%, var(--card-2));`;
  }
  function catColorStyle(categoriaNombre) {
    return iconKeyColorStyle(iconKeyFor(categoriaNombre));
  }

  function svgForKey(key, extraClass) {
    const inner = ICON_LIBRARY[key] || ICON_LIBRARY.dots;
    return `<svg class="${extraClass || ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  }

  function icon(categoriaNombre, extraClass) {
    return svgForKey(iconKeyFor(categoriaNombre), extraClass);
  }

  function todasCategorias() {
    const nombresCustom = categoriasCustom.map((c) => c.nombre).filter((n) => !L.CATEGORIAS_DEFAULT.includes(n));
    return L.CATEGORIAS_DEFAULT.concat(nombresCustom);
  }

  // ---- Color por quién pagó (para diferenciar gastos de un vistazo) ----
  // Por posición en `miembros` (no por hash del uuid): así dos miembros del
  // mismo grupo nunca coinciden en color mientras el grupo tenga ≤8
  // integrantes — un hash de string puede colisionar (un polinomio simple
  // mod 8 incluso colisiona sistemáticamente con UUIDs de dígito repetido,
  // lo cual detectó un test real acá), y lo único que importa de verdad es
  // que los colores se distingan dentro del grupo, no que sean estables
  // entre grupos distintos.
  const PAYER_COLOR_VARS = ['--ctp-blue', '--ctp-mauve', '--ctp-peach', '--ctp-teal', '--ctp-yellow', '--ctp-pink', '--ctp-sky', '--ctp-lavender'];
  function colorForUser(usuarioId) {
    const idx = miembros.findIndex((m) => m.usuarioId === usuarioId);
    return `var(${PAYER_COLOR_VARS[(idx >= 0 ? idx : 0) % PAYER_COLOR_VARS.length]})`;
  }

  function fmt(amount, currency) {
    try {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: currency || 'ARS', maximumFractionDigits: 2 }).format(amount);
    } catch (e) {
      return `${(amount || 0).toFixed(2)} ${currency || ''}`;
    }
  }

  function displayName(usuarioId) {
    if (user && usuarioId === user.id) return 'Vos';
    const m = miembros.find((x) => x.usuarioId === usuarioId);
    return (m && m.displayName) || 'Miembro';
  }

  // Igual que displayName pero sin el caso especial "Vos" — para listados
  // donde el pagador siempre debe verse con su alias, seas vos o no.
  function payerName(usuarioId) {
    const m = miembros.find((x) => x.usuarioId === usuarioId);
    return (m && m.displayName) || 'Miembro';
  }

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('toast-out'), 2800);
    setTimeout(() => el.remove(), 3200);
  }

  // Circulito verde con check (guardar gasto) o de monedas (marcar pagado)
  // que aparece brevemente en el centro de la pantalla al confirmar. Se
  // remueve solo cuando termina la animación CSS (burstPop).
  function successBurst(kind) {
    const el = document.createElement('div');
    el.className = kind === 'coins' ? 'success-burst coins' : 'success-burst';
    el.innerHTML = kind === 'coins' ? '🪙' : checkIconSvg();
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function uid() { return crypto.randomUUID(); }
  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // Mismo cálculo que usa la home para "Tu balance" — se reutiliza acá para
  // decidir el humor del honguito (null = sin grupo/usuario, no aplica).
  function miBalanceActual() {
    if (!grupoActivo || !user) return null;
    const balances = L.calcularBalances({
      gastos: gastos.map((g) => ({ pagadoPor: g.pagadoPor, montoBase: g.montoBase })),
      shares: gastos.flatMap((g) => g.shares),
      settlements: settlements.map((s) => ({ deUsuarioId: s.deUsuarioId, aUsuarioId: s.aUsuarioId, monto: s.monto })),
    });
    return balances[user.id] || 0;
  }

  // ---- Easter egg: honguito que se asoma de costado ----
  // Mismo personaje/asset que el minijuego secreto de lista-super, para que
  // se sienta parte del mismo ecosistema. Acá no hay minijuego: solo se
  // asoma siempre que hay un grupo activo, y al tocarlo reacciona según el
  // balance del usuario (llueve plata si está a favor, llora si está en contra).
  function updateMushroomVisibility() {
    const el = document.getElementById('mushroomPeek');
    if (!el) return;
    el.style.display = (grupoActivo && user) ? '' : 'none';
  }

  function lloverDinero() {
    const emojis = ['💵', '💸', '🪙'];
    for (let i = 0; i < 16; i++) {
      const el = document.createElement('div');
      el.className = 'money-drop';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = `${Math.random() * 96}vw`;
      el.style.fontSize = `${20 + Math.random() * 14}px`;
      el.style.animationDuration = `${1.6 + Math.random() * 1.2}s`;
      el.style.animationDelay = `${Math.random() * 0.4}s`;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  function hongoLlora(mush) {
    const rect = mush.getBoundingClientRect();
    for (let i = 0; i < 5; i++) {
      const el = document.createElement('div');
      el.className = 'tear-drop';
      el.textContent = '💧';
      el.style.top = `${rect.top + rect.height * 0.55}px`;
      el.style.left = `${rect.left + rect.width * 0.25 + Math.random() * rect.width * 0.4}px`;
      el.style.animationDelay = `${i * 0.15}s`;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  function onMushroomTap() {
    if (!grupoActivo || !user) return;
    const mush = document.getElementById('mushroomPeek');
    mush.classList.remove('happy', 'sad');
    void mush.offsetWidth; // fuerza reflow para poder repetir la animación si se toca varias veces seguidas
    mush.classList.add('peeking');
    setTimeout(() => mush.classList.remove('peeking'), 1400);

    const balance = miBalanceActual();
    if (balance > 0.005) {
      mush.classList.add('happy');
      lloverDinero();
    } else if (balance < -0.005) {
      mush.classList.add('sad');
      hongoLlora(mush);
    } else {
      toast('Todo saldado ✓');
    }
  }

  // ---- Render raíz ----
  // Guarda foco + selección antes de tirar el innerHTML abajo y los restaura
  // después: sin esto, cada re-render (ej. al tipear en el campo de monto,
  // que recalcula la conversión de moneda en vivo) le hace perder el foco al
  // input y corta la escritura a un carácter por tap.
  function render() {
    const active = document.activeElement;
    const activeId = active && active.id;
    const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
    const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;

    const app = document.getElementById('app');
    if (view === 'loading') {
      app.innerHTML = `<div class="empty-state">Cargando…</div>`;
    } else if (view === 'auth') {
      app.innerHTML = renderAuth();
    } else if (view === 'home') {
      app.innerHTML = renderHome();
    }
    renderOverlay();
    wireEvents();
    updateMushroomVisibility();

    if (activeId) {
      const el = document.getElementById(activeId);
      if (el && typeof el.focus === 'function') {
        el.focus();
        if (selStart != null && 'setSelectionRange' in el) {
          try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

  // ---- Auth ----
  function renderAuth() {
    if (authStep === 'email') {
      return `
        <div class="auth-wrap">
          <h1>bonapp-gastos</h1>
          <p class="tagline">Gastos compartidos, sin vueltas.</p>
          <div class="card">
            <label>Tu email</label>
            <input type="email" id="emailInput" placeholder="vos@email.com" value="${authEmail}" autocomplete="email">
            ${authError ? `<div class="field-error">${authError}</div>` : ''}
            <div class="btn-block-row">
              <button class="btn btn-primary" id="btnSendOtp" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Enviando…' : 'Enviar código'}</button>
            </div>
          </div>
        </div>`;
    }
    return `
      <div class="auth-wrap">
        <h1>bonapp-gastos</h1>
        <p class="tagline">Te mandamos un código a ${authEmail}</p>
        <div class="card">
          <label>Código de 6 dígitos</label>
          <input type="text" id="codeInput" inputmode="numeric" placeholder="123456" maxlength="8">
          ${authError ? `<div class="field-error">${authError}</div>` : ''}
          <div class="btn-block-row">
            <button class="btn btn-primary" id="btnVerifyOtp" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Confirmando…' : 'Confirmar'}</button>
            <button class="muted-link" id="btnBackToEmail">‹ Volver</button>
          </div>
        </div>
      </div>`;
  }

  function chevronIconSvg() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
  }

  // ---- Home: gastos del grupo activo (o estado vacío si todavía no hay uno) ----
  function renderHome() {
    const topBar = `
      <div class="top-bar">
        <button class="icon-btn group-switch-btn" id="btnAbrirGrupos">
          <span>${escapeHtml(grupoActivo ? grupoActivo.nombre : 'Elegí un grupo')}</span>${chevronIconSvg()}
        </button>
        <button class="icon-btn" id="btnAjustes">${gearIconSvg()}</button>
      </div>`;

    if (!grupoActivo) {
      return topBar + `
        <div class="empty-state" style="padding-top:3rem">
          Todavía no tenés un grupo activo.<br>Creá uno o unite con un link que te compartieron.
        </div>
        <div class="btn-block-row" style="margin-top:1.25rem">
          <button class="btn btn-primary" id="btnCrearGrupoInline">+ Crear grupo</button>
          <button class="btn btn-secondary" id="btnUnirseGrupoInline">Unirme con un link</button>
        </div>`;
    }

    const moneda = grupoActivo.monedaBase;
    const balances = L.calcularBalances({
      gastos: gastos.map((g) => ({ pagadoPor: g.pagadoPor, montoBase: g.montoBase })),
      shares: gastos.flatMap((g) => g.shares),
      settlements: settlements.map((s) => ({ deUsuarioId: s.deUsuarioId, aUsuarioId: s.aUsuarioId, monto: s.monto })),
    });
    const miBalance = balances[user.id] || 0;
    const miClase = miBalance > 0.005 ? 'pos' : miBalance < -0.005 ? 'neg' : 'zero';
    const miTexto = miBalance > 0.005 ? `+${fmt(miBalance, moneda)}` : miBalance < -0.005 ? `-${fmt(Math.abs(miBalance), moneda)}` : fmt(0, moneda);

    const simplificado = L.simplificarDeudas(balances);
    const deudasHtml = simplificado.length
      ? simplificado.map((t, i) => {
          const soyDeudor = t.deUsuarioId === user.id;
          const soyAcreedor = t.aUsuarioId === user.id;
          let txt;
          if (soyDeudor) txt = `Le debés a <b>${escapeHtml(displayName(t.aUsuarioId))}</b>`;
          else if (soyAcreedor) txt = `<b>${escapeHtml(displayName(t.deUsuarioId))}</b> te debe`;
          else txt = `<b>${escapeHtml(displayName(t.deUsuarioId))}</b> le debe a <b>${escapeHtml(displayName(t.aUsuarioId))}</b>`;
          return `
            <div class="debt-row">
              <div class="txt">${txt} ${fmt(t.monto, moneda)}</div>
              <button data-settle-idx="${i}">Marcar pagado</button>
            </div>`;
        }).join('')
      : `<div class="empty-state" style="padding:1rem">Todo saldado ✓</div>`;

    const categorias = todasCategorias().filter((c) => gastos.some((g) => g.categoria === c));
    // Si el filtro guardado ya no existe (categoría sin gastos, o sin pagos),
    // el select caería en "Todos" mientras la lista seguiría filtrada: se normaliza.
    const filtroActivo = filtroCategoria === FILTRO_PAGOS
      ? (settlements.length ? FILTRO_PAGOS : null)
      : (categorias.includes(filtroCategoria) ? filtroCategoria : null);

    const totalMov = gastos.length + settlements.length;
    const opcionesFiltro = [`<option value="" ${!filtroActivo ? 'selected' : ''}>Todos los movimientos (${totalMov})</option>`]
      .concat(categorias.map((c) => {
        const n = gastos.filter((g) => g.categoria === c).length;
        return `<option value="${escapeHtml(c)}" ${filtroActivo === c ? 'selected' : ''}>${escapeHtml(c)} (${n})</option>`;
      }));
    if (settlements.length) {
      opcionesFiltro.push(`<option value="${FILTRO_PAGOS}" ${filtroActivo === FILTRO_PAGOS ? 'selected' : ''}>Pagos saldados (${settlements.length})</option>`);
    }
    const filtroStyle = filtroActivo && filtroActivo !== FILTRO_PAGOS ? catColorStyle(filtroActivo) : '';
    const filtroHtml = `
      <div class="filter-bar" style="${filtroStyle}">
        ${filterIconSvg()}
        <select id="filtroMovimientos" aria-label="Filtrar movimientos">${opcionesFiltro.join('')}</select>
      </div>`;

    // Gastos y pagos saldados en una sola cronología por la fecha del
    // movimiento (no por cuándo se cargó); el mismo día desempata la hora de carga.
    const movimientos = [
      ...gastos.map((g) => ({ tipo: 'gasto', fecha: g.fecha, creadoEn: g.creadoEn || '', g })),
      ...settlements.map((st) => ({ tipo: 'pago', fecha: st.fecha, creadoEn: st.creadoEn || '', st })),
    ].sort((x, y) => (x.fecha < y.fecha ? 1 : x.fecha > y.fecha ? -1 : x.creadoEn < y.creadoEn ? 1 : x.creadoEn > y.creadoEn ? -1 : 0));

    const visibles = movimientos.filter((m) => {
      if (!filtroActivo) return true;
      if (filtroActivo === FILTRO_PAGOS) return m.tipo === 'pago';
      return m.tipo === 'gasto' && m.g.categoria === filtroActivo;
    });

    const gastosHtml = visibles.length
      ? visibles.map((m) => {
          if (m.tipo === 'pago') {
            const st = m.st;
            return `
              <div class="gasto-row pago" style="--payer-color:${colorForUser(st.deUsuarioId)}">
                <div class="cat-icon">${checkIconSvg()}</div>
                <div class="mid">
                  <div class="desc">${escapeHtml(payerName(st.deUsuarioId))} le pagó a ${escapeHtml(payerName(st.aUsuarioId))}</div>
                  <div class="meta"><span class="payer-dot"></span>Pago saldado · ${formatFecha(st.fecha)}${st.nota ? ` · ${escapeHtml(st.nota)}` : ''}</div>
                </div>
                <div class="monto">${fmt(st.monto, st.moneda || moneda)}</div>
              </div>`;
          }
          const g = m.g;
          const distinta = g.moneda !== moneda;
          const colorPagador = colorForUser(g.pagadoPor);
          return `
            <div class="gasto-row" data-edit-gasto="${g.id}" style="--payer-color:${colorPagador}">
              <div class="cat-icon" style="${catColorStyle(g.categoria)}">${icon(g.categoria)}</div>
              <div class="mid">
                <div class="desc">${escapeHtml(g.descripcion)}</div>
                <div class="meta"><span class="payer-dot"></span>${escapeHtml(payerName(g.pagadoPor))} pagó · ${formatFecha(g.fecha)}</div>
              </div>
              <div class="monto">${fmt(g.montoBase, moneda)}${distinta ? `<small>${fmt(g.monto, g.moneda)}</small>` : ''}</div>
            </div>`;
        }).join('')
      : `<div class="empty-state">${filtroActivo === FILTRO_PAGOS ? 'No hay pagos saldados.' : filtroActivo ? 'No hay gastos en esta categoría.' : 'No hay gastos todavía.'}</div>`;

    return topBar + `
      <div class="card balance-hero">
        <div class="label">Tu balance</div>
        <div class="amount ${miClase}">${miTexto}</div>
      </div>

      <div class="section-title">Saldos</div>
      <div class="card">${deudasHtml}</div>

      <div class="section-title">Movimientos</div>
      ${filtroHtml}
      <div style="margin-top:0.75rem">${gastosHtml}</div>

      <div class="fab">
        <button class="btn btn-primary" id="btnCargarGasto">+ Cargar gasto</button>
      </div>`;
  }

  function formatFecha(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y.slice(2)}`;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---- CSV: exportar / importar gastos (para compartir entre cuentas) ----

  function displayNameForExport(usuarioId) {
    const m = miembros.find((x) => x.usuarioId === usuarioId);
    return (m && m.displayName) || usuarioId;
  }

  function csvField(v) {
    const s = String(v == null ? '' : v);
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  // Una fila por gasto y una por pago saldado (tipo = pago): el pago va con
  // pagado_por = quien pagó y participantes = "Receptor:monto". Los pagos no
  // cuentan en Estadísticas, pero el CSV sí tiene que reflejarlos.
  function gastosToCsv() {
    const moneda = grupoActivo.monedaBase;
    const headers = ['tipo', 'fecha', 'descripcion', 'categoria', 'monto', 'moneda', 'tasa_cambio', 'monto_base', 'moneda_base', 'pagado_por', 'tipo_split', 'participantes', 'notas'];
    const filasGastos = gastos.map((g) => {
      const participantes = g.shares.map((s) => `${displayNameForExport(s.usuarioId)}:${s.montoBase}`).join(';');
      return {
        fecha: g.fecha, creadoEn: g.creadoEn || '',
        fila: [
          'gasto', g.fecha, g.descripcion, g.categoria, g.monto, g.moneda,
          g.tasaCambio != null ? g.tasaCambio : '', g.montoBase, moneda,
          displayNameForExport(g.pagadoPor), g.shares[0] ? g.shares[0].tipoSplit : 'igual',
          participantes, g.notas || '',
        ],
      };
    });
    const filasPagos = settlements.map((st) => ({
      fecha: st.fecha, creadoEn: st.creadoEn || '',
      fila: [
        'pago', st.fecha, 'Pago saldado', '', st.monto, st.moneda || moneda,
        '', st.monto, moneda,
        displayNameForExport(st.deUsuarioId), '',
        `${displayNameForExport(st.aUsuarioId)}:${st.monto}`, st.nota || '',
      ],
    }));
    const filas = [...filasGastos, ...filasPagos]
      .sort((x, y) => (x.fecha < y.fecha ? 1 : x.fecha > y.fecha ? -1 : x.creadoEn < y.creadoEn ? 1 : x.creadoEn > y.creadoEn ? -1 : 0))
      .map((x) => x.fila);
    return [headers, ...filas].map((f) => f.map(csvField).join(',')).join('\r\n');
  }

  function descargarBlob(blob, nombreArchivo) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // En la PWA instalada en Android el archivo bajaba bien a Descargas, pero
  // tocarlo no abría nada: Android no trae ninguna app registrada para
  // text/csv de fábrica. Con el share sheet el usuario lo manda directo a
  // Drive/Sheets/mail/WhatsApp, que sí saben qué hacer con un CSV. Si no hay
  // Web Share con archivos (escritorio, Firefox) cae a la descarga de antes.
  // Ojo: navigator.share exige gesto del usuario, así que esto tiene que
  // arrancar sincrónico dentro del handler del click, sin await previo.
  async function exportarCsv() {
    if (!grupoActivo) return;
    const csv = '﻿' + gastosToCsv();
    const nombreArchivo = `gastos-${grupoActivo.nombre.replace(/[^a-z0-9]+/gi, '-')}-${todayIso()}.csv`;

    if (typeof File === 'function' && navigator.canShare) {
      const file = new File([csv], nombreArchivo, { type: 'text/csv' });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: nombreArchivo });
          return;
        } catch (e) {
          // Cancelar el share sheet no es un error: no bajamos nada tampoco.
          if (e && e.name === 'AbortError') return;
          // Cualquier otra falla del share: seguimos con la descarga clásica.
        }
      }
    }
    descargarBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), nombreArchivo);
    toast('CSV descargado a tu carpeta de Descargas');
  }

  // Parser CSV manual (soporta campos entre comillas con comas/comillas/
  // saltos de línea escapados) — sin librerías, mismo criterio del resto.
  function parseCsv(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = '';
      } else if (c === '\r') {
        // ignorar, \n cierra la fila
      } else if (c === '\n') {
        row.push(field); rows.push(row); row = []; field = '';
      } else {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.length > 1 || (r.length === 1 && r[0] !== ''));
  }

  // Matchea pagado_por/participantes por nombre para mostrar (alias o
  // email) contra los miembros del grupo ACTIVO — un CSV exportado de otra
  // cuenta/grupo solo puede reimportarse si esos mismos nombres ya son
  // miembros acá; lo que no matchea se reporta y se salta, no se adivina.
  async function importarCsvTexto(text) {
    if (!grupoActivo) throw new Error('No hay un grupo activo');
    const rows = parseCsv(text);
    if (rows.length < 2) throw new Error('El CSV no tiene filas para importar');
    const headers = rows[0].map((h) => h.trim().toLowerCase());
    const colIdx = (name) => headers.indexOf(name);
    const requeridas = ['fecha', 'descripcion', 'categoria', 'monto', 'moneda', 'pagado_por', 'participantes'];
    const faltantes = requeridas.filter((r) => colIdx(r) === -1);
    if (faltantes.length) throw new Error(`Faltan columnas en el CSV: ${faltantes.join(', ')}`);

    const porNombre = new Map(miembros.map((m) => [(m.displayName || '').trim().toLowerCase(), m.usuarioId]));
    const saltados = [];
    let importados = 0;

    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r.length || (r.length === 1 && !r[0])) continue;
      const get = (name) => { const j = colIdx(name); return j === -1 ? '' : (r[j] || '').trim(); };
      const filaNum = i + 1;

      const pagadoPor = porNombre.get(get('pagado_por').toLowerCase());
      if (!pagadoPor) { saltados.push(`Fila ${filaNum}: no encontré a "${get('pagado_por')}" entre los miembros`); continue; }

      // Los CSV anteriores a la v1.11.0 no tienen columna tipo: todo es gasto.
      if (get('tipo').toLowerCase() === 'pago') {
        const [nombreReceptor] = get('participantes').split(';')[0].split(':');
        const aUsuarioId = porNombre.get((nombreReceptor || '').trim().toLowerCase());
        if (!aUsuarioId) { saltados.push(`Fila ${filaNum}: no encontré a "${nombreReceptor}" entre los miembros`); continue; }
        const montoPago = Number(get('monto'));
        if (!montoPago || montoPago <= 0) { saltados.push(`Fila ${filaNum}: monto inválido`); continue; }
        try {
          await window.Sync.saveSettlement({
            id: uid(), deUsuarioId: pagadoPor, aUsuarioId, monto: montoPago,
            moneda: get('moneda') || grupoActivo.monedaBase,
            fecha: /^\d{4}-\d{2}-\d{2}$/.test(get('fecha')) ? get('fecha') : todayIso(),
            nota: get('notas') || '',
          });
          importados++;
        } catch (e) {
          saltados.push(`Fila ${filaNum}: ${e.message || 'error al guardar'}`);
        }
        continue;
      }

      const partesTxt = get('participantes').split(';').map((p) => p.trim()).filter(Boolean);
      const shares = [];
      let nombreNoEncontrado = null;
      for (const parte of partesTxt) {
        const [nombreParte, montoParteStr] = parte.split(':');
        const participanteId = porNombre.get((nombreParte || '').trim().toLowerCase());
        if (!participanteId) { nombreNoEncontrado = nombreParte; break; }
        shares.push({ usuarioId: participanteId, tipoSplit: get('tipo_split') || 'igual', valor: null, montoBase: L.round2(Number(montoParteStr) || 0) });
      }
      if (nombreNoEncontrado) { saltados.push(`Fila ${filaNum}: no encontré a "${nombreNoEncontrado}" entre los miembros`); continue; }
      if (!shares.length) { saltados.push(`Fila ${filaNum}: sin participantes válidos`); continue; }

      const monto = Number(get('monto'));
      if (!monto || monto <= 0) { saltados.push(`Fila ${filaNum}: monto inválido`); continue; }
      const montoBaseTxt = get('monto_base');
      const tasaTxt = get('tasa_cambio');

      const gasto = {
        id: uid(),
        descripcion: get('descripcion') || get('categoria') || 'Importado',
        monto,
        moneda: get('moneda') || grupoActivo.monedaBase,
        tasaCambio: tasaTxt ? Number(tasaTxt) : null,
        montoBase: L.round2(montoBaseTxt ? Number(montoBaseTxt) : monto),
        categoria: get('categoria') || 'Otros',
        pagadoPor,
        fecha: /^\d{4}-\d{2}-\d{2}$/.test(get('fecha')) ? get('fecha') : todayIso(),
        notas: get('notas') || '',
        shares,
      };
      try {
        await window.Sync.saveGasto(gasto);
        importados++;
      } catch (e) {
        saltados.push(`Fila ${filaNum}: ${e.message || 'error al guardar'}`);
      }
    }
    return { importados, saltados };
  }

  // ---- Backup local automático ----
  // Cada 10 gastos guardados (creados o editados) desde este dispositivo,
  // se guarda una foto del grupo activo en localStorage, rotando entre 3
  // slots que se pisan entre sí (no se acumulan archivos) — totalmente en
  // silencio, sin cartel ni interrupción. El contador es global al
  // dispositivo, no por grupo.
  const BACKUP_CONTADOR_KEY = 'bona_consumos_gastos_subidos';
  const BACKUP_SLOT_KEY = 'bona_consumos_backup_slot';

  function registrarGastoSubidoYBackupSiCorresponde() {
    let n = 0;
    try { n = parseInt(localStorage.getItem(BACKUP_CONTADOR_KEY) || '0', 10) || 0; } catch (e) {}
    n += 1;
    try { localStorage.setItem(BACKUP_CONTADOR_KEY, String(n)); } catch (e) {}
    if (n % 10 === 0) hacerBackupLocal();
  }

  function hacerBackupLocal() {
    if (!grupoActivo) return;
    try {
      const slot = (parseInt(localStorage.getItem(BACKUP_SLOT_KEY) || '0', 10) || 0) % 3;
      const snapshot = {
        fecha: new Date().toISOString(),
        grupoId: grupoActivo.id,
        grupoNombre: grupoActivo.nombre,
        monedaBase: grupoActivo.monedaBase,
        gastos, settlements, categoriasCustom, miembros,
      };
      localStorage.setItem(`bona_consumos_backup_${slot}`, JSON.stringify(snapshot));
      localStorage.setItem(BACKUP_SLOT_KEY, String((slot + 1) % 3));
    } catch (e) {
      // A propósito silencioso — un backup local nunca debe interrumpir el
      // flujo ni mostrar error; si localStorage está lleno o no disponible
      // se pierde ese backup puntual sin romper nada más.
      console.warn('[backup local] no se pudo guardar', e);
    }
  }

  // ---- Overlays ----
  // Pila de overlays sincronizada con el historial del navegador: cada
  // openOverlay() empuja una entrada de historial, así el botón "atrás" del
  // sistema (Android, gesto de iOS, navegador) vuelve al menú anterior hasta
  // llegar a la pantalla principal, en vez de sacar al usuario de la app.
  // history.state.bonaDepth = cuántos overlays hay abiertos en esa entrada.
  let overlayStack = []; // overlays por debajo del actual
  const overlayDepth = () => (overlay ? overlayStack.length + 1 : 0);

  // Con el overlay abierto, la pantalla de fondo (home) no debe scrollear —
  // overflow:hidden en el body no alcanza en iOS instalado como PWA (sigue
  // habiendo rubber-band), así que se lo saca del flujo con position:fixed
  // guardando el scroll actual, y se lo restaura tal cual al cerrar.
  let scrollLockY = 0;
  let scrollLocked = false;
  function applyOverlayVisibility() {
    const abierto = !!overlay;
    document.getElementById('overlayBackdrop').classList.toggle('open', abierto);
    document.getElementById('overlaySheet').classList.toggle('open', abierto);
    if (abierto && !scrollLocked) {
      scrollLockY = window.scrollY;
      document.body.style.position = 'fixed';
      document.body.style.top = `-${scrollLockY}px`;
      document.body.style.left = '0';
      document.body.style.right = '0';
      scrollLocked = true;
    } else if (!abierto && scrollLocked) {
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      scrollLocked = false;
      window.scrollTo(0, scrollLockY);
    }
  }

  function pushOverlayHistory() {
    try { history.pushState({ bonaDepth: overlayDepth() }, ''); } catch (e) {}
  }

  // Sube un nivel: al overlay anterior, o a la pantalla principal.
  function volverOverlay() {
    if (!overlay) return;
    overlay = overlayStack.pop() || null;
    applyOverlayVisibility();
    render();
    try { history.back(); } catch (e) {}
  }

  // Cierra todo (✕, fondo, o acción terminada) y deshace las entradas de
  // historial que abrió, para que "atrás" no reabra nada ni quede trabado.
  function closeOverlay() {
    if (!overlay) return;
    // El overlay de "nueva categoría" se abre desde arriba del formulario de
    // gasto — cerrarlo con la ✕ tiene que volver al gasto en progreso, no
    // tirar todo el draft.
    if (overlay.type === 'nuevaCategoria' && overlayStack.length) return volverOverlay();
    const depth = overlayDepth();
    overlay = null;
    overlayStack = [];
    applyOverlayVisibility();
    render();
    try { history.go(-depth); } catch (e) {}
  }

  function openOverlay(next) {
    if (overlay) overlayStack.push(overlay);
    overlay = next;
    pushOverlayHistory();
    render();
    applyOverlayVisibility();
  }

  // "Atrás" del sistema. Es idempotente: baja la pila hasta la profundidad
  // que dice la entrada de historial, así sirve tanto para un paso como para
  // el history.go(-n) de closeOverlay() (que ya dejó la pila en 0).
  window.addEventListener('popstate', (ev) => {
    const objetivo = (ev.state && ev.state.bonaDepth) || 0;
    if (objetivo > overlayDepth()) {
      // "Adelante" hacia un overlay que ya no existe: volvemos a donde estamos.
      try { history.go(overlayDepth() - objetivo); } catch (e) {}
      return;
    }
    if (objetivo === overlayDepth()) return;
    while (overlayDepth() > objetivo) overlay = overlayStack.pop() || null;
    applyOverlayVisibility();
    render();
  });
  try { history.replaceState({ bonaDepth: 0 }, ''); } catch (e) {}

  function renderOverlay() {
    const body = document.getElementById('overlayBody');
    if (!overlay) { body.innerHTML = ''; return; }
    if (overlay.type === 'grupos') body.innerHTML = renderGruposOverlay();
    else if (overlay.type === 'crearGrupo') body.innerHTML = renderCrearGrupoOverlay();
    else if (overlay.type === 'unirseGrupo') body.innerHTML = renderUnirseGrupoOverlay();
    else if (overlay.type === 'ajustes') body.innerHTML = renderAjustesOverlay();
    else if (overlay.type === 'versiones') body.innerHTML = renderVersionesOverlay();
    else if (overlay.type === 'estadisticas') body.innerHTML = renderEstadisticasOverlay();
    else if (overlay.type === 'gasto') body.innerHTML = renderGastoOverlay(overlay);
    else if (overlay.type === 'settle') body.innerHTML = renderSettleOverlay(overlay);
    else if (overlay.type === 'nuevaCategoria') body.innerHTML = renderNuevaCategoriaOverlay(overlay);
  }

  // ---- Overlay: estadísticas (dinámico por grupo activo) ----

  // Límites ISO inclusivos del rango elegido ('' = sin límite). gc_gastos.fecha
  // es un date de Postgres, o sea siempre 'YYYY-MM-DD', así que alcanza con
  // comparar strings — sin parsear a Date ni pelear con zonas horarias.
  function rangoEstadisticas() {
    const hoy = new Date();
    const y = hoy.getFullYear();
    const m = hoy.getMonth();
    // día 0 del mes siguiente = último día del mes pedido
    const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (estadisticasRango === 'mes') return { desde: iso(new Date(y, m, 1)), hasta: iso(new Date(y, m + 1, 0)) };
    if (estadisticasRango === 'mesPasado') return { desde: iso(new Date(y, m - 1, 1)), hasta: iso(new Date(y, m, 0)) };
    if (estadisticasRango === 'anio') return { desde: `${y}-01-01`, hasta: `${y}-12-31` };
    if (estadisticasRango === 'custom') return { desde: estadisticasDesde, hasta: estadisticasHasta };
    return { desde: '', hasta: '' };
  }

  function renderEstadisticasOverlay() {
    if (!grupoActivo) {
      return `
        <div class="sheet-header"><h2>Estadísticas</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>
        <div class="empty-state">No hay un grupo activo.</div>`;
    }
    const moneda = grupoActivo.monedaBase;
    const header = `<div class="sheet-header"><h2>Estadísticas — ${escapeHtml(grupoActivo.nombre)}</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>`;

    // Los chips van siempre, incluso si el rango quedó vacío: si no, el usuario
    // se queda trabado en el estado vacío sin forma de ampliar el filtro.
    const chipsRango = RANGOS_ESTADISTICAS.map((r) =>
      `<button class="chip ${estadisticasRango === r.key ? 'active' : ''}" data-set-estadisticas-rango="${r.key}">${r.label}</button>`
    ).join('');
    const customHtml = estadisticasRango === 'custom' ? `
      <div class="stat-range-custom">
        <div><label>Desde</label><div class="date-field"><input type="date" id="estDesde" value="${estadisticasDesde}"><span class="date-overlay">${formatFecha(estadisticasDesde)}</span></div></div>
        <div><label>Hasta</label><div class="date-field"><input type="date" id="estHasta" value="${estadisticasHasta}"><span class="date-overlay">${formatFecha(estadisticasHasta)}</span></div></div>
      </div>` : '';
    const filtrosHtml = `<div class="chips">${chipsRango}</div>${customHtml}`;

    if (!gastos.length) {
      return `${header}<div class="empty-state">Todavía no hay gastos en este grupo.</div>`;
    }

    const { desde, hasta } = rangoEstadisticas();
    const enRango = gastos.filter((g) => (!desde || g.fecha >= desde) && (!hasta || g.fecha <= hasta));

    if (!enRango.length) {
      return `${header}${filtrosHtml}<div class="empty-state">No hay gastos en el rango elegido.</div>`;
    }

    const totales = {};
    enRango.forEach((g) => { totales[g.categoria] = (totales[g.categoria] || 0) + g.montoBase; });
    const filas = Object.keys(totales)
      .map((cat) => ({ categoria: cat, valor: totales[cat], colorVar: ICON_KEY_COLOR[iconKeyFor(cat)] || '--ctp-lavender' }))
      .sort((a, b) => b.valor - a.valor);

    const totalGeneral = filas.reduce((a, f) => a + f.valor, 0);
    const chartData = filas.map((f) => ({ value: f.valor, colorVar: f.colorVar }));
    const chartHtml = estadisticasTipo === 'torta'
      ? `<div style="display:flex; justify-content:center; margin:0.5rem 0">${window.Charts.pieChart(chartData)}</div>`
      : `<div style="margin:0.5rem 0">${window.Charts.barChart(chartData, { rowHeight: 34 })}</div>`;

    const leyenda = filas.map((f) => {
      const pct = totalGeneral > 0 ? Math.round((f.valor / totalGeneral) * 100) : 0;
      return `
        <div class="stat-row" style="--cat-color:var(${f.colorVar})">
          <span class="stat-label">${icon(f.categoria, 'stat-icon')} ${escapeHtml(f.categoria)}</span>
          <span class="stat-value">${fmt(f.valor, moneda)} <small>(${pct}%)</small></span>
        </div>`;
    }).join('');

    const plural = enRango.length === 1 ? '1 gasto' : `${enRango.length} gastos`;
    return `
      ${header}
      ${filtrosHtml}
      <div class="chips">
        <button class="chip ${estadisticasTipo === 'torta' ? 'active' : ''}" data-set-estadisticas-tipo="torta">Torta</button>
        <button class="chip ${estadisticasTipo === 'barras' ? 'active' : ''}" data-set-estadisticas-tipo="barras">Barras</button>
      </div>
      ${chartHtml}
      <div class="section-title" style="margin-top:0.5rem">Total: ${fmt(totalGeneral, moneda)} <small>(${plural})</small></div>
      <div>${leyenda}</div>`;
  }

  // ---- Overlay: cargar/editar gasto ----
  function renderGastoOverlay(ov) {
    const editando = !!ov.editId;
    const g = editando ? gastos.find((x) => x.id === ov.editId) : null;
    const draft = ov.draft;

    const moneda = grupoActivo.monedaBase;
    const categorias = todasCategorias();

    const catTiles = categorias.map((c) =>
      `<button class="category-tile ${draft.categoria === c ? 'active' : ''}" data-set-categoria="${escapeHtml(c)}" style="${catColorStyle(c)}">${icon(c)}<span>${escapeHtml(c)}</span></button>`
    ).join('') + `<button class="category-tile" id="btnNuevaCategoria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>Nueva</span></button>`;

    const pagadorOpts = miembros.map((m) =>
      `<option value="${m.usuarioId}" ${draft.pagadoPor === m.usuarioId ? 'selected' : ''}>${escapeHtml(displayName(m.usuarioId))}</option>`
    ).join('');

    const modoChips = [
      { v: 'igual', label: 'Partes iguales' },
      { v: 'personalizar', label: 'Personalizar' },
    ].map((o) => {
      const activo = o.v === 'igual' ? draft.modo === 'igual' : draft.modo !== 'igual';
      return `<button class="chip ${activo ? 'active' : ''}" data-set-modo="${o.v}">${o.label}</button>`;
    }).join('');

    let subModoChips = '';
    if (draft.modo !== 'igual') {
      subModoChips = `<div class="chips" style="margin-top:0.4rem">` + [
        { v: 'monto_fijo', label: 'Montos' },
        { v: 'porcentaje', label: 'Porcentajes' },
        { v: 'shares', label: 'Partes (shares)' },
      ].map((o) => `<button class="chip ${draft.modo === o.v ? 'active' : ''}" data-set-modo="${o.v}">${o.label}</button>`).join('') + `</div>`;
    }

    const totalNumber = Number(draft.monto) || 0;

    // Preview en vivo de cuánto le toca a cada uno, sin usar calcularShares
    // (esa valida que las partes sumen el total y tira error si todavía no
    // están completas — acá solo queremos mostrar mientras se carga, no
    // validar). 'monto_fijo' no necesita preview: el input ya ES el monto.
    let montoPorParticipante = {};
    if (draft.modo === 'igual' && draft.participantes.length > 0 && totalNumber > 0) {
      const partes = L.splitEqual(totalNumber, draft.participantes.length);
      draft.participantes.forEach((id, i) => { montoPorParticipante[id] = partes[i]; });
    } else if ((draft.modo === 'porcentaje' || draft.modo === 'shares') && draft.participantes.length > 0 && totalNumber > 0) {
      const pesos = draft.participantes.map((id) => Number(draft.valores[id]) || 0);
      const sumaPesos = pesos.reduce((a, b) => a + b, 0);
      if (sumaPesos > 0) {
        const partes = L.splitByWeights(totalNumber, pesos);
        draft.participantes.forEach((id, i) => { montoPorParticipante[id] = partes[i]; });
      }
    }

    const participantesRows = miembros.map((m) => {
      const incluido = draft.participantes.includes(m.usuarioId);
      const valor = draft.valores[m.usuarioId] != null ? draft.valores[m.usuarioId] : '';
      let inputHtml = '';
      if (draft.modo !== 'igual' && incluido) {
        const placeholder = draft.modo === 'porcentaje' ? '%' : draft.modo === 'shares' ? 'partes' : moneda;
        inputHtml = `<input type="text" inputmode="decimal" data-valor-participante="${m.usuarioId}" value="${valor}" placeholder="${placeholder}">`;
      }
      const montoHtml = incluido && montoPorParticipante[m.usuarioId] != null
        ? `<span class="pmonto">${fmt(montoPorParticipante[m.usuarioId], moneda)}</span>`
        : '';
      return `
        <div class="participant-row">
          <input type="checkbox" data-toggle-participante="${m.usuarioId}" ${incluido ? 'checked' : ''}>
          <span class="pname">${escapeHtml(displayName(m.usuarioId))}</span>
          ${montoHtml}
          ${inputHtml}
        </div>`;
    }).join('');

    let sumHint = '';
    if (draft.modo === 'monto_fijo') {
      const suma = draft.participantes.reduce((a, id) => a + (Number(draft.valores[id]) || 0), 0);
      const ok = Math.abs(L.round2(suma) - L.round2(totalNumber)) < 0.01;
      sumHint = `<div class="split-sum-hint ${ok ? 'ok' : 'bad'}">Suma: ${fmt(suma, moneda)} de ${fmt(totalNumber, moneda)}</div>`;
    } else if (draft.modo === 'porcentaje') {
      const suma = draft.participantes.reduce((a, id) => a + (Number(draft.valores[id]) || 0), 0);
      const ok = Math.abs(L.round2(suma) - 100) < 0.01;
      sumHint = `<div class="split-sum-hint ${ok ? 'ok' : 'bad'}">Suma: ${L.round2(suma)}% de 100%</div>`;
    }

    const necesitaTasa = draft.moneda !== moneda;

    return `
      <div class="sheet-header"><h2>${editando ? 'Editar gasto' : 'Cargar gasto'}</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>

      <div class="row-2">
        <div>
          <label>Monto</label>
          <input type="text" inputmode="decimal" id="gMonto" value="${draft.monto}" placeholder="0.00">
        </div>
        <div>
          <label>Moneda</label>
          <select id="gMoneda">${MONEDAS.map((m) => `<option value="${m}" ${draft.moneda === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
        </div>
      </div>
      ${necesitaTasa ? `
        <label>Tasa de cambio (1 ${draft.moneda} = X ${moneda})</label>
        <input type="text" inputmode="decimal" id="gTasa" value="${draft.tasaCambio || ''}" placeholder="Ej: 1200">
        <div class="split-sum-hint">≈ ${fmt((Number(draft.monto) || 0) * (Number(draft.tasaCambio) || 0), moneda)}</div>
      ` : ''}

      <label>Categoría</label>
      <div class="category-grid">${catTiles}</div>

      <label>Descripción</label>
      <input type="text" id="gDescripcion" value="${escapeHtml(draft.descripcion)}" placeholder="Ej: Supermercado">

      <label>¿Quién pagó?</label>
      <select id="gPagador">${pagadorOpts}</select>

      <label>Fecha</label>
      <div class="date-field"><input type="date" id="gFecha" value="${draft.fecha}"><span class="date-overlay">${formatFecha(draft.fecha)}</span></div>

      <label>¿Cómo se divide?</label>
      <div class="chips">${modoChips}</div>
      ${subModoChips}

      <label>Entre quiénes</label>
      <div class="card" style="margin-top:0.3rem">${participantesRows}</div>
      ${sumHint}

      <label>Notas (opcional)</label>
      <textarea id="gNotas" placeholder="Opcional">${escapeHtml(draft.notas || '')}</textarea>

      ${draft.error ? `<div class="field-error">${escapeHtml(draft.error)}</div>` : ''}

      <div class="btn-block-row">
        <button class="btn btn-primary" id="btnGuardarGasto">Guardar</button>
        ${editando ? `<button class="btn btn-danger" id="btnEliminarGasto">Eliminar gasto</button>` : ''}
      </div>`;
  }

  function nuevoDraftGasto(existente) {
    if (existente) {
      const participantes = existente.shares.map((s) => s.usuarioId);
      const valores = {};
      existente.shares.forEach((s) => {
        // `valor` guarda siempre el número tal como lo tipeó la persona
        // (monto fijo en moneda original, porcentaje o shares) — `montoBase`
        // es el resultado ya convertido, no lo que hay que reponer en el input.
        if (s.valor != null) valores[s.usuarioId] = s.valor;
      });
      return {
        monto: existente.monto,
        moneda: existente.moneda,
        tasaCambio: existente.tasaCambio,
        descripcion: existente.descripcion,
        categoria: existente.categoria,
        pagadoPor: existente.pagadoPor,
        fecha: existente.fecha,
        notas: existente.notas || '',
        modo: existente.shares[0] ? existente.shares[0].tipoSplit : 'igual',
        participantes,
        valores,
        error: '',
      };
    }
    return {
      monto: '',
      moneda: grupoActivo.monedaBase,
      tasaCambio: null,
      descripcion: '',
      categoria: L.CATEGORIAS_DEFAULT[0],
      pagadoPor: user.id,
      fecha: todayIso(),
      notas: '',
      modo: 'igual',
      participantes: miembros.map((m) => m.usuarioId),
      valores: {},
      error: '',
    };
  }

  // ---- Overlay: settle ----
  function renderSettleOverlay(ov) {
    const opts = miembros.map((m) => `<option value="${m.usuarioId}" ${ov.draft.deUsuarioId === m.usuarioId ? 'selected' : ''}>${escapeHtml(displayName(m.usuarioId))}</option>`);
    const optsA = miembros.map((m) => `<option value="${m.usuarioId}" ${ov.draft.aUsuarioId === m.usuarioId ? 'selected' : ''}>${escapeHtml(displayName(m.usuarioId))}</option>`);
    return `
      <div class="sheet-header"><h2>Marcar como pagado</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>
      <label>¿Quién pagó?</label>
      <select id="stDe">${opts.join('')}</select>
      <label>¿A quién?</label>
      <select id="stA">${optsA.join('')}</select>
      <label>Monto</label>
      <input type="text" inputmode="decimal" id="stMonto" value="${ov.draft.monto}">
      <label>Fecha</label>
      <div class="date-field"><input type="date" id="stFecha" value="${ov.draft.fecha}"><span class="date-overlay">${formatFecha(ov.draft.fecha)}</span></div>
      <label>Nota (opcional)</label>
      <input type="text" id="stNota" value="${escapeHtml(ov.draft.nota || '')}">
      ${ov.draft.error ? `<div class="field-error">${escapeHtml(ov.draft.error)}</div>` : ''}
      <div class="btn-block-row">
        <button class="btn btn-primary" id="btnConfirmarSettle">Guardar</button>
      </div>`;
  }

    on('#estHasta', 'change', (el) => { estadisticasHasta = el.value; render(); });

    on('#btnActualizar', 'click', async (el) => {
      el.disabled = true;
      // Fuerza la actualización aunque el navegador todavía no haya
      // detectado que sw.js cambió de bytes — borra los caches y desregistra
      // el service worker antes de recargar, en vez de confiar en
      // reg.update() (mismo motivo/técnica que el botón de refresh de
      // lista-super/repartirlalucila).
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
      } catch (e) {}
      location.reload();
    });

    on('#btnTogglePalette', 'click', () => {

      const actual = document.documentElement.getAttribute('data-accent') || 'blue';

      document.documentElement.setAttribute('data-accent', siguiente);
      try { localStorage.setItem('bona_consumos_palette', siguiente); } catch (e) {}
      render();

    on('#btnCerrarOverlay', 'click', () => closeOverlay());

    on('#btnGuardarAlias', 'click', async () => {
      const alias = (document.getElementById('aliasInput').value || '').trim();
      try {
        await window.Sync.updateMyDisplayName(alias);
