<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>bonapp-gastos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e1e2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bonapp-gastos">
<meta name="mobile-web-app-capable" content="yes">
<script>
  (function() {
    try {
      var t = localStorage.getItem('bona_consumos_theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --ctp-red: #f38ba8;
    --ctp-peach: #fab387;
    --ctp-yellow: #f9e2af;
    --ctp-green: #a6e3a1;
    --ctp-teal: #94e2d5;
    --ctp-blue: #89b4fa;
    --ctp-mauve: #cba6f7;
    --ctp-pink: #f5c2e7;
    --ctp-sky: #89dceb;
    --ctp-lavender: #b4befe;

    --bg: #1e1e2e;
    --card: #313244;
    --card-2: #45475a;
    --border: #45475a;
    --text: #cdd6f4;
    --text-dim: #a6adc8;
    --accent: var(--ctp-blue);
    --accent-dim: rgba(137,180,250,0.18);
    --positive: var(--ctp-green);
    --negative: var(--ctp-red);
    --on-accent: #1e1e2e;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  :root[data-theme="light"] {
    --ctp-red: #d20f39;
    --ctp-peach: #fe640b;
    --ctp-yellow: #df8e1d;
    --ctp-green: #40a02b;
    --ctp-teal: #179299;
    --ctp-blue: #1e66f5;
    --ctp-mauve: #8839ef;
    --ctp-pink: #ea76cb;
    --ctp-sky: #04a5e5;
    --ctp-lavender: #7287fd;

    --bg: #eff1f5;
    --card: #ffffff;
    --card-2: #e6e9ef;
    --border: #ccd0da;
    --text: #4c4f69;
    --text-dim: #6c6f85;
    --accent: var(--ctp-blue);
    --accent-dim: rgba(30,102,245,0.10);
    --positive: var(--ctp-green);
    --negative: var(--ctp-red);
    --on-accent: #ffffff;
    --shadow: 0 8px 24px rgba(76,79,105,0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button, input, select, textarea { font-family: inherit; }
  button { touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer; }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 1rem 1rem 6rem;
    /* En iOS instalada como PWA (status bar "black-translucent" +
       viewport-fit=cover), el contenido arranca debajo del notch/batería si
       no se le suma el safe-area-inset-top acá — el max() mantiene el
       padding de 1rem normal en Android/desktop, donde ese inset es 0. */
    padding-top: max(1rem, env(safe-area-inset-top));
    padding-left: max(1rem, env(safe-area-inset-left));
    padding-right: max(1rem, env(safe-area-inset-right));
  }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.5rem; margin-bottom: 1.25rem;
  }
  .top-bar h1 { font-size: 1.25rem; margin: 0; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .group-switch-btn {
    width: auto; padding: 0 0.9rem 0 1rem; gap: 0.45rem;
    font-size: 1rem; font-weight: 600; max-width: 75%;
  }
  .group-switch-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-switch-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    border: none; border-radius: 14px; padding: 0.85rem 1.1rem;
    font-size: 0.98rem; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: var(--on-accent); width: 100%; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); width: 100%; }
  .btn-danger { background: transparent; color: var(--negative); border: 1px solid var(--negative); width: 100%; }
  .btn-block-row { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 1rem; margin-bottom: 0.75rem;
  }

  input[type="text"], input[type="email"], input[type="date"], select, textarea {
    width: 100%; background: var(--card-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem 0.8rem;
    font-size: 1rem; margin-top: 0.3rem;
  }
  textarea { resize: vertical; min-height: 3rem; }
  label { font-size: 0.82rem; color: var(--text-dim); display: block; margin-top: 0.85rem; }
  label:first-child { margin-top: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.4rem; }
  .chip {
    background: var(--card-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 999px; padding: 0.45rem 0.9rem; font-size: 0.85rem;
    display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip svg { width: 15px; height: 15px; }

  .empty-state { text-align: center; color: var(--text-dim); padding: 2.5rem 1rem; font-size: 0.92rem; }

  .grupo-card {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 1rem; margin-bottom: 0.75rem;
  }
  .grupo-card .nombre { font-weight: 600; font-size: 1.02rem; }
  .balance-tag { font-weight: 700; font-size: 0.98rem; }
  .balance-tag.pos { color: var(--positive); }
  .balance-tag.neg { color: var(--negative); }
  .balance-tag.zero { color: var(--text-dim); }

  .balance-hero {
    text-align: center; padding: 1.25rem 1rem 1.5rem;
  }
  .balance-hero .label { color: var(--text-dim); font-size: 0.85rem; }
  .balance-hero .amount { font-size: 2.1rem; font-weight: 700; margin-top: 0.25rem; }
  .balance-hero .amount.pos { color: var(--positive); }
  .balance-hero .amount.neg { color: var(--negative); }
  .balance-hero .amount.zero { color: var(--text-dim); }

  .debt-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.65rem 0; border-bottom: 1px dashed var(--border);
    gap: 0.5rem;
  }
  .debt-row:last-child { border-bottom: none; }
  .debt-row .txt { font-size: 0.9rem; }
  .debt-row .txt b { color: var(--text); }
  .debt-row button {
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 0.4rem 0.7rem; font-size: 0.78rem; white-space: nowrap;
  }

  .section-title {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); margin: 1.4rem 0 0.5rem;
  }

  .gasto-row {
    display: flex; align-items: center; gap: 0.7rem;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    border-left: 4px solid var(--payer-color, var(--border));
    padding: 0.75rem 0.85rem; margin-bottom: 0.55rem;
  }
  .gasto-row .cat-icon {
    width: 38px; height: 38px; border-radius: 10px; background: var(--card-2);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .gasto-row .cat-icon svg { width: 19px; height: 19px; color: var(--accent); }
  .gasto-row .mid { flex: 1; min-width: 0; }
  .gasto-row .desc { font-weight: 600; font-size: 0.94rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gasto-row .meta { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.15rem; display: flex; align-items: center; gap: 0.35rem; }
  .payer-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--payer-color, var(--text-dim)); flex-shrink: 0; }
  .gasto-row .monto { font-weight: 700; font-size: 0.94rem; text-align: right; white-space: nowrap; }
  .gasto-row .monto small { display: block; font-weight: 400; color: var(--text-dim); font-size: 0.7rem; }

  .category-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-top: 0.4rem;
  }
  .category-tile {
    aspect-ratio: 1; background: var(--card-2); border: 1px solid var(--border);
    border-radius: 14px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 0.4rem; color: var(--text-dim); padding: 0.5rem;
  }
  .category-tile.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .category-tile svg { width: 24px; height: 24px; }
  .category-tile span { font-size: 0.78rem; font-weight: 600; text-align: center; line-height: 1.2; }

  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(1.25rem, calc(env(safe-area-inset-bottom) + 0.5rem));
    width: min(420px, calc(100% - 2rem));
    z-index: 5;
  }
  .fab .btn-primary { box-shadow: var(--shadow); }

  .overlay-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; z-index: 10;
  }
  .overlay-backdrop.open { display: block; }
  .overlay-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 90vh;
    background: var(--bg); border-radius: 20px 20px 0 0;
    padding: 1rem 1.1rem calc(1.5rem + env(safe-area-inset-bottom));
    overflow-y: auto; z-index: 11;
    transform: translateY(100%); transition: transform 0.2s ease;
  }
  .overlay-sheet.open { transform: translateY(0); }
  .overlay-sheet-inner { max-width: 480px; margin: 0 auto; }
  .sheet-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem;
  }
  .sheet-header h2 { font-size: 1.1rem; margin: 0; }

  .participant-row {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .participant-row:last-child { border-bottom: none; }
  .participant-row .pname { flex: 1; font-size: 0.9rem; }
  .participant-row input[type="checkbox"] { width: 18px; height: 18px; }
  .participant-row input[type="text"] { width: 90px; margin: 0; text-align: right; }

  .split-sum-hint { font-size: 0.8rem; margin-top: 0.5rem; text-align: right; }
  .split-sum-hint.ok { color: var(--positive); }
  .split-sum-hint.bad { color: var(--negative); }

  .field-error { color: var(--negative); font-size: 0.82rem; margin-top: 0.5rem; }
  .muted-link { background: none; border: none; color: var(--accent); font-size: 0.85rem; padding: 0.4rem 0; }

  .auth-wrap { padding-top: 3rem; text-align: center; }
  .auth-wrap h1 { font-size: 1.6rem; letter-spacing: 0.02em; margin-bottom: 0.25rem; }
  .auth-wrap p.tagline { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 2rem; }
  .auth-wrap .card { text-align: left; }

  .row-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 0.6rem; }

  .share-link-box {
    display: flex; gap: 0.5rem; align-items: center; margin-top: 0.4rem;
  }
  .share-link-box input { flex: 1; font-size: 0.82rem; }
  .share-link-box button { flex-shrink: 0; }

  .member-line { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed var(--border); font-size: 0.9rem; }
  .member-line:last-child { border-bottom: none; }

  .app-info { text-align: center; margin-bottom: 1.5rem; }
  .app-name { font-weight: 700; font-size: 1.7rem; }
  .version-row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.4rem; }
  .version-btn {
    background: none; border: none; color: var(--ctp-mauve); font-size: 0.85rem;
    font-weight: 600; padding: 0.2rem 0.3rem; text-decoration: underline dotted;
  }
  .update-btn { width: 28px; height: 28px; opacity: 0.65; }
  .update-btn svg { width: 14px; height: 14px; }

  .version-list { max-height: 55vh; overflow-y: auto; }
  .version-entry { padding: 0.85rem 0; border-bottom: 1px dashed var(--border); }
  .version-entry:last-child { border-bottom: none; }
  .version-entry-header { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.94rem; margin-bottom: 0.4rem; }
  .version-entry-header span { color: var(--text-dim); font-size: 0.78rem; }
  .version-entry ul { margin: 0; padding-left: 1.1rem; font-size: 0.85rem; color: var(--text-dim); }
  .version-entry li { margin-bottom: 0.25rem; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(1.25rem, calc(env(safe-area-inset-bottom) + 0.5rem));
    background: var(--card-2); border: 1px solid var(--border); color: var(--text);
    padding: 0.7rem 1.1rem; border-radius: 12px; font-size: 0.85rem; z-index: 20;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="overlay-backdrop" id="overlayBackdrop"></div>
<div class="overlay-sheet" id="overlaySheet"><div class="overlay-sheet-inner" id="overlayBody"></div></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="sync.js"></script>
<script>
(function () {
  const L = window.Logic;

  // ---- Estado ----
  let user = null;
  let misGrupos = [];
  let misGruposLoaded = false;
  let grupoActivo = null; // { id, nombre, monedaBase, creadoPor }
  let gastos = [];
  let settlements = [];
  let categoriasCustom = [];
  let miembros = [];
  let view = 'loading'; // 'auth' | 'home' — "home" es la pantalla de gastos
  // del grupo activo (o el estado vacío si todavía no hay ninguno); cambiar
  // de grupo o crear/unirse a otro se hace desde el overlay "grupos", no
  // navegando a una pantalla aparte.
  let authStep = 'email';
  let authEmail = '';
  let authBusy = false;
  let authError = '';
  let filtroCategoria = null;
  let overlay = null;
  let pendingJoinCode = null;

  const MONEDAS = ['ARS', 'USD', 'EUR', 'BRL', 'UYU', 'CLP'];

  // Bumpear en cada push, sin excepción — no importa el tamaño del cambio
  // (mismo criterio que lista-super, ver memoria "changelog discipline").
  // Entrada más nueva primero.
  const APP_VERSION = '1.5.1';
  const CHANGELOG = [
    { version: '1.5.1', fecha: '2026-08-19', notas: [
      'Fix iOS: la barra superior ya no queda tapada por el notch/batería (safe-area-inset).',
      'El botón de cargar gasto y los avisos también respetan el safe-area de abajo (home indicator).',
    ] },
    { version: '1.5.0', fecha: '2026-08-19', notas: [
      'Alias de miembro (en Ajustes) — reemplaza el email en todos los grupos.',
      'Gastos con color según quién los pagó, para distinguirlos de un vistazo.',
      'Categorías rediseñadas: módulos cuadrados con ícono, se movió la descripción justo debajo y se autocompleta al elegir categoría.',
      'Nuevas categorías predeterminadas: Salidas, Super, Servicios, Transporte.',
      'Categorías custom ahora eligen ícono de un set predefinido, no un ícono genérico.',
    ] },
    { version: '1.4.0', fecha: '2026-08-19', notas: [
      'Ajustes: se saca la palabra "Ajustes" (redundante con el engranaje).',
      'Toggle de tema único (sol/luna) junto a la ✕, reemplaza los chips Claro/Oscuro.',
      'Nombre de la app más grande, versión con color.',
    ] },
    { version: '1.3.0', fecha: '2026-08-19', notas: [
      'Rename de la app a "bonapp-gastos".',
      'Ajustes ahora muestra nombre de la app y versión, con historial de cambios y botón para forzar actualización.',
    ] },
    { version: '1.2.0', fecha: '2026-08-19', notas: [
      'Ajustes de la app (engranaje) separados de la gestión del grupo activo.',
      'Compartir/invitar, miembros, renombrar, salir y eliminar se movieron al selector de grupos.',
      'Tocar el fondo cierra cualquier ventana, no solo la ✕.',
      'Toggle de tema claro/oscuro.',
    ] },
    { version: '1.1.0', fecha: '2026-08-19', notas: [
      'La pantalla principal pasa a ser los gastos del grupo activo (antes era la lista de grupos).',
      'Selector de grupo arriba, siempre entra al último grupo usado.',
    ] },
  ];

  // Set fijo de íconos generados (sin emoji): las 4 categorías predefinidas
  // usan claves puntuales, y el resto queda disponible como opciones para
  // el picker al crear una categoría custom (ver ICON_PICKER_KEYS).
  const ICON_LIBRARY = {
    fork: '<path d="M6 2v7a2 2 0 0 0 2 2v11M6 2v9M10 2v9M10 2v20M18 2c-2.2 0-4 3.6-4 8s1.8 8 4 8 4-3.6 4-8-1.8-8-4-8z"/>',
    cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
    wrench: '<path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4l-3.4 3.4-2-2 3.4-3.4z"/>',
    bus: '<path d="M3 13l1.5-6A2 2 0 0 1 6.4 5.5h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="2" y="13" width="20" height="6" rx="1.5"/><circle cx="6.5" cy="19.5" r="1.5"/><circle cx="17.5" cy="19.5" r="1.5"/>',
    home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>',
    gift: '<rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13"/><path d="M3 12h18"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
    heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/>',
    plane: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>',
    dots: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  };
  const ICON_LABELS = {
    fork: 'Salidas', cart: 'Super', wrench: 'Servicios', bus: 'Transporte',
    home: 'Hogar', gift: 'Regalos', heart: 'Salud', plane: 'Viajes', dots: 'Otro',
  };
  const ICON_PICKER_KEYS = ['home', 'gift', 'heart', 'plane', 'cart', 'fork', 'wrench', 'bus', 'dots'];
  const CATEGORY_ICON_KEY = { Salidas: 'fork', Super: 'cart', Servicios: 'wrench', Transporte: 'bus' };

  function iconKeyFor(categoriaNombre) {
    if (CATEGORY_ICON_KEY[categoriaNombre]) return CATEGORY_ICON_KEY[categoriaNombre];
    const custom = categoriasCustom.find((c) => c.nombre === categoriaNombre);
    if (custom && custom.icono && ICON_LIBRARY[custom.icono]) return custom.icono;
    return 'dots';
  }

  function svgForKey(key, extraClass) {
    const inner = ICON_LIBRARY[key] || ICON_LIBRARY.dots;
    return `<svg class="${extraClass || ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  }

  function icon(categoriaNombre, extraClass) {
    return svgForKey(iconKeyFor(categoriaNombre), extraClass);
  }

  function todasCategorias() {
    const nombresCustom = categoriasCustom.map((c) => c.nombre).filter((n) => !L.CATEGORIAS_DEFAULT.includes(n));
    return L.CATEGORIAS_DEFAULT.concat(nombresCustom);
  }

  // ---- Color por quién pagó (para diferenciar gastos de un vistazo) ----
  // Por posición en `miembros` (no por hash del uuid): así dos miembros del
  // mismo grupo nunca coinciden en color mientras el grupo tenga ≤8
  // integrantes — un hash de string puede colisionar (un polinomio simple
  // mod 8 incluso colisiona sistemáticamente con UUIDs de dígito repetido,
  // lo cual detectó un test real acá), y lo único que importa de verdad es
  // que los colores se distingan dentro del grupo, no que sean estables
  // entre grupos distintos.
  const PAYER_COLOR_VARS = ['--ctp-blue', '--ctp-mauve', '--ctp-peach', '--ctp-teal', '--ctp-yellow', '--ctp-pink', '--ctp-sky', '--ctp-lavender'];
  function colorForUser(usuarioId) {
    const idx = miembros.findIndex((m) => m.usuarioId === usuarioId);
    return `var(${PAYER_COLOR_VARS[(idx >= 0 ? idx : 0) % PAYER_COLOR_VARS.length]})`;
  }

  function fmt(amount, currency) {
    try {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: currency || 'ARS', maximumFractionDigits: 2 }).format(amount);
    } catch (e) {
      return `${(amount || 0).toFixed(2)} ${currency || ''}`;
    }
  }

  function displayName(usuarioId) {
    if (user && usuarioId === user.id) return 'Vos';
    const m = miembros.find((x) => x.usuarioId === usuarioId);
    return (m && m.displayName) || 'Miembro';
  }

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  function uid() { return crypto.randomUUID(); }
  function todayIso() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // ---- Render raíz ----
  // Guarda foco + selección antes de tirar el innerHTML abajo y los restaura
  // después: sin esto, cada re-render (ej. al tipear en el campo de monto,
  // que recalcula la conversión de moneda en vivo) le hace perder el foco al
  // input y corta la escritura a un carácter por tap.
  function render() {
    const active = document.activeElement;
    const activeId = active && active.id;
    const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
    const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;

    const app = document.getElementById('app');
    if (view === 'loading') {
      app.innerHTML = `<div class="empty-state">Cargando…</div>`;
    } else if (view === 'auth') {
      app.innerHTML = renderAuth();
    } else if (view === 'home') {
      app.innerHTML = renderHome();
    }
    renderOverlay();
    wireEvents();

    if (activeId) {
      const el = document.getElementById(activeId);
      if (el && typeof el.focus === 'function') {
        el.focus();
        if (selStart != null && 'setSelectionRange' in el) {
          try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

  // ---- Auth ----
  function renderAuth() {
    if (authStep === 'email') {
      return `
        <div class="auth-wrap">
          <h1>bonapp-gastos</h1>
          <p class="tagline">Gastos compartidos, sin vueltas.</p>
          <div class="card">
            <label>Tu email</label>
            <input type="email" id="emailInput" placeholder="vos@email.com" value="${authEmail}" autocomplete="email">
            ${authError ? `<div class="field-error">${authError}</div>` : ''}
            <div class="btn-block-row">
              <button class="btn btn-primary" id="btnSendOtp" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Enviando…' : 'Enviar código'}</button>
            </div>
          </div>
        </div>`;
    }
    return `
      <div class="auth-wrap">
        <h1>bonapp-gastos</h1>
        <p class="tagline">Te mandamos un código a ${authEmail}</p>
        <div class="card">
          <label>Código de 6 dígitos</label>
          <input type="text" id="codeInput" inputmode="numeric" placeholder="123456" maxlength="8">
          ${authError ? `<div class="field-error">${authError}</div>` : ''}
          <div class="btn-block-row">
            <button class="btn btn-primary" id="btnVerifyOtp" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Confirmando…' : 'Confirmar'}</button>
            <button class="muted-link" id="btnBackToEmail">‹ Volver</button>
          </div>
        </div>
      </div>`;
  }

  function chevronIconSvg() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
  }

  // ---- Home: gastos del grupo activo (o estado vacío si todavía no hay uno) ----
  function renderHome() {
    const topBar = `
      <div class="top-bar">
        <button class="icon-btn group-switch-btn" id="btnAbrirGrupos">
          <span>${escapeHtml(grupoActivo ? grupoActivo.nombre : 'Elegí un grupo')}</span>${chevronIconSvg()}
        </button>
        <button class="icon-btn" id="btnAjustes">${gearIconSvg()}</button>
      </div>`;

    if (!grupoActivo) {
      return topBar + `
        <div class="empty-state" style="padding-top:3rem">
          Todavía no tenés un grupo activo.<br>Creá uno o unite con un link que te compartieron.
        </div>
        <div class="btn-block-row" style="margin-top:1.25rem">
          <button class="btn btn-primary" id="btnCrearGrupoInline">+ Crear grupo</button>
          <button class="btn btn-secondary" id="btnUnirseGrupoInline">Unirme con un link</button>
        </div>`;
    }

    const moneda = grupoActivo.monedaBase;
    const balances = L.calcularBalances({
      gastos: gastos.map((g) => ({ pagadoPor: g.pagadoPor, montoBase: g.montoBase })),
      shares: gastos.flatMap((g) => g.shares),
      settlements: settlements.map((s) => ({ deUsuarioId: s.deUsuarioId, aUsuarioId: s.aUsuarioId, monto: s.monto })),
    });
    const miBalance = balances[user.id] || 0;
    const miClase = miBalance > 0.005 ? 'pos' : miBalance < -0.005 ? 'neg' : 'zero';
    const miTexto = miBalance > 0.005 ? `+${fmt(miBalance, moneda)}` : miBalance < -0.005 ? `-${fmt(Math.abs(miBalance), moneda)}` : fmt(0, moneda);

    const simplificado = L.simplificarDeudas(balances);
    const deudasHtml = simplificado.length
      ? simplificado.map((t, i) => {
          const soyDeudor = t.deUsuarioId === user.id;
          const soyAcreedor = t.aUsuarioId === user.id;
          let txt;
          if (soyDeudor) txt = `Le debés a <b>${escapeHtml(displayName(t.aUsuarioId))}</b>`;
          else if (soyAcreedor) txt = `<b>${escapeHtml(displayName(t.deUsuarioId))}</b> te debe`;
          else txt = `<b>${escapeHtml(displayName(t.deUsuarioId))}</b> le debe a <b>${escapeHtml(displayName(t.aUsuarioId))}</b>`;
          return `
            <div class="debt-row">
              <div class="txt">${txt} ${fmt(t.monto, moneda)}</div>
              <button data-settle-idx="${i}">Marcar pagado</button>
            </div>`;
        }).join('')
      : `<div class="empty-state" style="padding:1rem">Todo saldado ✓</div>`;

    const categorias = todasCategorias();
    const chipsCat = [`<button class="chip ${!filtroCategoria ? 'active' : ''}" data-filtro-cat="">Todas</button>`]
      .concat(categorias.filter((c) => gastos.some((g) => g.categoria === c)).map((c) =>
        `<button class="chip ${filtroCategoria === c ? 'active' : ''}" data-filtro-cat="${escapeHtml(c)}">${icon(c)} ${escapeHtml(c)}</button>`
      )).join('');

    const gastosFiltrados = filtroCategoria ? gastos.filter((g) => g.categoria === filtroCategoria) : gastos;
    const gastosHtml = gastosFiltrados.length
      ? gastosFiltrados.map((g) => {
          const distinta = g.moneda !== moneda;
          const colorPagador = colorForUser(g.pagadoPor);
          return `
            <div class="gasto-row" data-edit-gasto="${g.id}" style="--payer-color:${colorPagador}">
              <div class="cat-icon">${icon(g.categoria)}</div>
              <div class="mid">
                <div class="desc">${escapeHtml(g.descripcion)}</div>
                <div class="meta"><span class="payer-dot"></span>${escapeHtml(displayName(g.pagadoPor))} pagó · ${formatFecha(g.fecha)}</div>
              </div>
              <div class="monto">${fmt(g.montoBase, moneda)}${distinta ? `<small>${fmt(g.monto, g.moneda)}</small>` : ''}</div>
            </div>`;
        }).join('')
      : `<div class="empty-state">No hay gastos ${filtroCategoria ? 'en esta categoría' : 'todavía'}.</div>`;

    return topBar + `
      <div class="card balance-hero">
        <div class="label">Tu balance</div>
        <div class="amount ${miClase}">${miTexto}</div>
      </div>

      <div class="section-title">Saldos</div>
      <div class="card">${deudasHtml}</div>

      <div class="section-title">Gastos</div>
      <div class="chips">${chipsCat}</div>
      <div style="margin-top:0.75rem">${gastosHtml}</div>

      <div class="fab">
        <button class="btn btn-primary" id="btnCargarGasto">+ Cargar gasto</button>
      </div>`;
  }

  function gearIconSvg() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
  }

  // Muestra a qué modo cambiás si tocás el botón (no el modo actual): en
  // oscuro se ve un sol (tocar pasa a claro), en claro una luna.
  function themeToggleIconSvg(theme) {
    return theme === 'dark'
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
  }

  function refreshIconSvg() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>`;
  }

  function formatFecha(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y.slice(2)}`;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---- Overlays ----
  function closeOverlay() {
    // El overlay de "nueva categoría" se abre desde arriba del formulario de
    // gasto — cerrarlo con la ✕ tiene que volver al gasto en progreso, no
    // tirar todo el draft.
    if (overlay && overlay.type === 'nuevaCategoria' && overlay.prevOverlay) {
      overlay = overlay.prevOverlay;
      return render();
    }
    overlay = null;
    document.getElementById('overlayBackdrop').classList.remove('open');
    document.getElementById('overlaySheet').classList.remove('open');
    render();
  }

  function openOverlay(next) {
    overlay = next;
    render();
    document.getElementById('overlayBackdrop').classList.add('open');
    document.getElementById('overlaySheet').classList.add('open');
  }

  function renderOverlay() {
    const body = document.getElementById('overlayBody');
    if (!overlay) { body.innerHTML = ''; return; }
    if (overlay.type === 'grupos') body.innerHTML = renderGruposOverlay();
    else if (overlay.type === 'crearGrupo') body.innerHTML = renderCrearGrupoOverlay();
    else if (overlay.type === 'unirseGrupo') body.innerHTML = renderUnirseGrupoOverlay();
    else if (overlay.type === 'ajustes') body.innerHTML = renderAjustesOverlay();
    else if (overlay.type === 'versiones') body.innerHTML = renderVersionesOverlay();
    else if (overlay.type === 'gasto') body.innerHTML = renderGastoOverlay(overlay);
    else if (overlay.type === 'settle') body.innerHTML = renderSettleOverlay(overlay);
    else if (overlay.type === 'nuevaCategoria') body.innerHTML = renderNuevaCategoriaOverlay(overlay);
  }

  function renderGruposOverlay() {
    let listHtml;
    if (!misGruposLoaded) {
      listHtml = `<div class="empty-state">Cargando tus grupos…</div>`;
    } else if (!misGrupos.length) {
      listHtml = `<div class="empty-state">Todavía no tenés grupos.<br>Creá uno o unite con un link que te compartieron.</div>`;
    } else {
      listHtml = misGrupos.map((g) => {
        const cls = g.balance > 0.005 ? 'pos' : g.balance < -0.005 ? 'neg' : 'zero';
        const txt = g.balance > 0.005 ? `+${fmt(g.balance, g.monedaBase)}` : g.balance < -0.005 ? `-${fmt(Math.abs(g.balance), g.monedaBase)}` : fmt(0, g.monedaBase);
        const activo = grupoActivo && g.id === grupoActivo.id;
        return `
          <div class="grupo-card" data-switch-grupo="${g.id}" style="${activo ? `border-color:var(--accent)` : ''}">
            <div class="nombre">${escapeHtml(g.nombre)}${activo ? ' ✓' : ''}</div>
            <div class="balance-tag ${cls}">${txt}</div>
          </div>`;
      }).join('');
    }

    const gestionGrupoActivo = grupoActivo ? renderGestionGrupoActivo() : '';

    return `
      <div class="sheet-header"><h2>Mis grupos</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>
      ${gestionGrupoActivo}
      <div class="section-title" style="margin-top:${gestionGrupoActivo ? '1.5rem' : '0'}">Cambiar de grupo</div>
      ${listHtml}
      <div class="btn-block-row" style="margin-top:1.25rem">
        <button class="btn btn-primary" id="btnCrearGrupo">+ Crear grupo</button>
        <button class="btn btn-secondary" id="btnUnirseGrupo">Unirme con un link</button>
      </div>`;
  }

  // Gestión del grupo actualmente activo (compartir/invitar, miembros,
  // renombrar, salir, eliminar) — vive acá, en el mismo menú donde se elige
  // el grupo, no en un menú aparte por pantalla.
  function renderGestionGrupoActivo() {
    const soyCreador = grupoActivo && user && grupoActivo.creadoPor === user.id;
    const link = window.Sync.getShareLink();
    return `
      <div class="section-title" style="margin-top:0">${escapeHtml(grupoActivo.nombre)}</div>
      <div class="card">
        <label style="margin-top:0">Compartir / invitar</label>
        <div class="share-link-box">
          <input type="text" id="shareLinkInput" readonly value="${link || ''}">
          <button class="btn btn-secondary" id="btnCopiarLink" style="width:auto">Copiar</button>
        </div>

        <label>Miembros</label>
        ${miembros.map((m) => `<div class="member-line"><span>${escapeHtml(m.displayName || 'Miembro')}</span></div>`).join('')}

        <label>Renombrar</label>
        <input type="text" id="renombrarInput" value="${escapeHtml(grupoActivo.nombre)}">
        <div class="btn-block-row">
          <button class="btn btn-secondary" id="btnGuardarNombre">Guardar nombre</button>
        </div>

        <div class="btn-block-row" style="margin-top:1rem">
          <button class="btn btn-danger" id="btnSalirGrupo">Salir del grupo</button>
          ${soyCreador ? `<button class="btn btn-danger" id="btnEliminarGrupo">Eliminar grupo</button>` : ''}
        </div>
      </div>`;
  }

  function renderCrearGrupoOverlay() {
    return `
      <div class="sheet-header"><h2>Crear grupo</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>
      <label>Nombre del grupo</label>
      <input type="text" id="cgNombre" placeholder="Depto, Viaje a Bariloche…">
      <label>Moneda base</label>
      <select id="cgMoneda">${MONEDAS.map((m) => `<option value="${m}" ${m === 'ARS' ? 'selected' : ''}>${m}</option>`).join('')}</select>
      <div class="btn-block-row">
        <button class="btn btn-primary" id="btnConfirmarCrearGrupo">Crear</button>
      </div>`;
  }

  function renderUnirseGrupoOverlay() {
    return `
      <div class="sheet-header"><h2>Unirme a un grupo</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>
      <label>Pegá el link o el código que te compartieron</label>
      <input type="text" id="jgInput" placeholder="https://…?grupo=…">
      <div class="btn-block-row">
        <button class="btn btn-primary" id="btnConfirmarUnirse">Unirme</button>
      </div>`;
  }

  function renderAjustesOverlay() {
    const theme = document.documentElement.getAttribute('data-theme') || 'dark';
    return `
      <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-bottom:1.25rem">
        <button class="icon-btn" id="btnToggleTheme" title="Cambiar tema">${themeToggleIconSvg(theme)}</button>
        <button class="icon-btn" id="btnCerrarOverlay">✕</button>
      </div>

      <div class="app-info">
        <div class="app-name">bonapp-gastos</div>
        <div class="version-row">
          <button class="version-btn" id="btnVerVersiones">v${APP_VERSION}</button>
          <button class="icon-btn update-btn" id="btnActualizar" title="Buscar actualización">${refreshIconSvg()}</button>
        </div>
      </div>

      <label>Tu alias</label>
      <input type="text" id="aliasInput" value="${escapeHtml(window.Sync.getMyAlias())}" placeholder="${escapeHtml(user ? user.email : '')}">
      <div class="btn-block-row">
        <button class="btn btn-secondary" id="btnGuardarAlias">Guardar alias</button>
      </div>

      <div class="btn-block-row" style="margin-top:2rem">
        <button class="btn btn-danger" id="btnLogout">Cerrar sesión</button>
      </div>`;
  }

  function renderVersionesOverlay() {
    const entradas = CHANGELOG.slice(0, 3).map((v) => `
      <div class="version-entry">
        <div class="version-entry-header"><b>v${v.version}</b><span>${v.fecha}</span></div>
        <ul>${v.notas.map((n) => `<li>${escapeHtml(n)}</li>`).join('')}</ul>
      </div>`).join('');
    return `
      <div class="sheet-header"><h2>Últimas versiones</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>
      <div class="version-list">${entradas}</div>`;
  }

  function renderNuevaCategoriaOverlay(ov) {
    const draft = ov.draft;
    const tiles = ICON_PICKER_KEYS.map((k) =>
      `<button class="category-tile ${draft.icono === k ? 'active' : ''}" data-set-nueva-cat-icono="${k}">${svgForKey(k)}<span>${ICON_LABELS[k]}</span></button>`
    ).join('');
    return `
      <div class="sheet-header"><h2>Nueva categoría</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>
      <label>Nombre</label>
      <input type="text" id="nuevaCatInput" value="${escapeHtml(draft.nombre)}" placeholder="Ej: Mascotas">
      <label>Ícono</label>
      <div class="category-grid">${tiles}</div>
      <div class="btn-block-row">
        <button class="btn btn-primary" id="btnConfirmarNuevaCategoria">Agregar</button>
      </div>`;
  }

  // ---- Overlay: cargar/editar gasto ----
  function renderGastoOverlay(ov) {
    const editando = !!ov.editId;
    const g = editando ? gastos.find((x) => x.id === ov.editId) : null;
    const draft = ov.draft;

    const moneda = grupoActivo.monedaBase;
    const categorias = todasCategorias();

    const catTiles = categorias.map((c) =>
      `<button class="category-tile ${draft.categoria === c ? 'active' : ''}" data-set-categoria="${escapeHtml(c)}">${icon(c)}<span>${escapeHtml(c)}</span></button>`
    ).join('') + `<button class="category-tile" id="btnNuevaCategoria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>Nueva</span></button>`;

    const pagadorOpts = miembros.map((m) =>
      `<option value="${m.usuarioId}" ${draft.pagadoPor === m.usuarioId ? 'selected' : ''}>${escapeHtml(displayName(m.usuarioId))}</option>`
    ).join('');

    const modoChips = [
      { v: 'igual', label: 'Partes iguales' },
      { v: 'personalizar', label: 'Personalizar' },
    ].map((o) => {
      const activo = o.v === 'igual' ? draft.modo === 'igual' : draft.modo !== 'igual';
      return `<button class="chip ${activo ? 'active' : ''}" data-set-modo="${o.v}">${o.label}</button>`;
    }).join('');

    let subModoChips = '';
    if (draft.modo !== 'igual') {
      subModoChips = `<div class="chips" style="margin-top:0.4rem">` + [
        { v: 'monto_fijo', label: 'Montos' },
        { v: 'porcentaje', label: 'Porcentajes' },
        { v: 'shares', label: 'Partes (shares)' },
      ].map((o) => `<button class="chip ${draft.modo === o.v ? 'active' : ''}" data-set-modo="${o.v}">${o.label}</button>`).join('') + `</div>`;
    }

    const totalNumber = Number(draft.monto) || 0;
    const participantesRows = miembros.map((m) => {
      const incluido = draft.participantes.includes(m.usuarioId);
      const valor = draft.valores[m.usuarioId] != null ? draft.valores[m.usuarioId] : '';
      let inputHtml = '';
      if (draft.modo !== 'igual' && incluido) {
        const placeholder = draft.modo === 'porcentaje' ? '%' : draft.modo === 'shares' ? 'partes' : moneda;
        inputHtml = `<input type="text" inputmode="decimal" data-valor-participante="${m.usuarioId}" value="${valor}" placeholder="${placeholder}">`;
      }
      return `
        <div class="participant-row">
          <input type="checkbox" data-toggle-participante="${m.usuarioId}" ${incluido ? 'checked' : ''}>
          <span class="pname">${escapeHtml(displayName(m.usuarioId))}</span>
          ${inputHtml}
        </div>`;
    }).join('');

    let sumHint = '';
    if (draft.modo === 'monto_fijo') {
      const suma = draft.participantes.reduce((a, id) => a + (Number(draft.valores[id]) || 0), 0);
      const ok = Math.abs(L.round2(suma) - L.round2(totalNumber)) < 0.01;
      sumHint = `<div class="split-sum-hint ${ok ? 'ok' : 'bad'}">Suma: ${fmt(suma, moneda)} de ${fmt(totalNumber, moneda)}</div>`;
    } else if (draft.modo === 'porcentaje') {
      const suma = draft.participantes.reduce((a, id) => a + (Number(draft.valores[id]) || 0), 0);
      const ok = Math.abs(L.round2(suma) - 100) < 0.01;
      sumHint = `<div class="split-sum-hint ${ok ? 'ok' : 'bad'}">Suma: ${L.round2(suma)}% de 100%</div>`;
    }

    const necesitaTasa = draft.moneda !== moneda;

    return `
      <div class="sheet-header"><h2>${editando ? 'Editar gasto' : 'Cargar gasto'}</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>

      <div class="row-2">
        <div>
          <label>Monto</label>
          <input type="text" inputmode="decimal" id="gMonto" value="${draft.monto}" placeholder="0.00">
        </div>
        <div>
          <label>Moneda</label>
          <select id="gMoneda">${MONEDAS.map((m) => `<option value="${m}" ${draft.moneda === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
        </div>
      </div>
      ${necesitaTasa ? `
        <label>Tasa de cambio (1 ${draft.moneda} = X ${moneda})</label>
        <input type="text" inputmode="decimal" id="gTasa" value="${draft.tasaCambio || ''}" placeholder="Ej: 1200">
        <div class="split-sum-hint">≈ ${fmt((Number(draft.monto) || 0) * (Number(draft.tasaCambio) || 0), moneda)}</div>
      ` : ''}

      <label>Categoría</label>
      <div class="category-grid">${catTiles}</div>

      <label>Descripción</label>
      <input type="text" id="gDescripcion" value="${escapeHtml(draft.descripcion)}" placeholder="Ej: Supermercado">

      <label>¿Quién pagó?</label>
      <select id="gPagador">${pagadorOpts}</select>

      <label>Fecha</label>
      <input type="date" id="gFecha" value="${draft.fecha}">

      <label>¿Cómo se divide?</label>
      <div class="chips">${modoChips}</div>
      ${subModoChips}

      <label>Entre quiénes</label>
      <div class="card" style="margin-top:0.3rem">${participantesRows}</div>
      ${sumHint}

      <label>Notas (opcional)</label>
      <textarea id="gNotas" placeholder="Opcional">${escapeHtml(draft.notas || '')}</textarea>

      ${draft.error ? `<div class="field-error">${escapeHtml(draft.error)}</div>` : ''}

      <div class="btn-block-row">
        <button class="btn btn-primary" id="btnGuardarGasto">Guardar</button>
        ${editando ? `<button class="btn btn-danger" id="btnEliminarGasto">Eliminar gasto</button>` : ''}
      </div>`;
  }

  function nuevoDraftGasto(existente) {
    if (existente) {
      const participantes = existente.shares.map((s) => s.usuarioId);
      const valores = {};
      existente.shares.forEach((s) => {
        // `valor` guarda siempre el número tal como lo tipeó la persona
        // (monto fijo en moneda original, porcentaje o shares) — `montoBase`
        // es el resultado ya convertido, no lo que hay que reponer en el input.
        if (s.valor != null) valores[s.usuarioId] = s.valor;
      });
      return {
        monto: existente.monto,
        moneda: existente.moneda,
        tasaCambio: existente.tasaCambio,
        descripcion: existente.descripcion,
        categoria: existente.categoria,
        pagadoPor: existente.pagadoPor,
        fecha: existente.fecha,
        notas: existente.notas || '',
        modo: existente.shares[0] ? existente.shares[0].tipoSplit : 'igual',
        participantes,
        valores,
        error: '',
      };
    }
    return {
      monto: '',
      moneda: grupoActivo.monedaBase,
      tasaCambio: null,
      descripcion: '',
      categoria: L.CATEGORIAS_DEFAULT[0],
      pagadoPor: user.id,
      fecha: todayIso(),
      notas: '',
      modo: 'igual',
      participantes: miembros.map((m) => m.usuarioId),
      valores: {},
      error: '',
    };
  }

  // ---- Overlay: settle ----
  function renderSettleOverlay(ov) {
    const opts = miembros.map((m) => `<option value="${m.usuarioId}" ${ov.draft.deUsuarioId === m.usuarioId ? 'selected' : ''}>${escapeHtml(displayName(m.usuarioId))}</option>`);
    const optsA = miembros.map((m) => `<option value="${m.usuarioId}" ${ov.draft.aUsuarioId === m.usuarioId ? 'selected' : ''}>${escapeHtml(displayName(m.usuarioId))}</option>`);
    return `
      <div class="sheet-header"><h2>Marcar como pagado</h2><button class="icon-btn" id="btnCerrarOverlay">✕</button></div>
      <label>¿Quién pagó?</label>
      <select id="stDe">${opts.join('')}</select>
      <label>¿A quién?</label>
      <select id="stA">${optsA.join('')}</select>
      <label>Monto</label>
      <input type="text" inputmode="decimal" id="stMonto" value="${ov.draft.monto}">
      <label>Fecha</label>
      <input type="date" id="stFecha" value="${ov.draft.fecha}">
      <label>Nota (opcional)</label>
      <input type="text" id="stNota" value="${escapeHtml(ov.draft.nota || '')}">
      ${ov.draft.error ? `<div class="field-error">${escapeHtml(ov.draft.error)}</div>` : ''}
      <div class="btn-block-row">
        <button class="btn btn-primary" id="btnConfirmarSettle">Guardar</button>
      </div>`;
  }

  // ---- Eventos ----
  function wireEvents() {
    const app = document.getElementById('app');

    on('#btnSendOtp', 'click', async () => {
      const email = (document.getElementById('emailInput').value || '').trim();
      if (!email) { authError = 'Ingresá tu email'; return render(); }
      authBusy = true; authError = ''; render();
      try {
        await window.Sync.sendOtp(email);
        authEmail = email; authStep = 'code'; authBusy = false; render();
      } catch (e) {
        authBusy = false; authError = e.message || 'No se pudo enviar el código'; render();
      }
    });

    on('#btnBackToEmail', 'click', () => { authStep = 'email'; authError = ''; render(); });

    on('#btnVerifyOtp', 'click', async () => {
      const code = (document.getElementById('codeInput').value || '').trim();
      if (!code) { authError = 'Ingresá el código'; return render(); }
      authBusy = true; authError = ''; render();
      try {
        await window.Sync.verifyOtp(authEmail, code);
      } catch (e) {
        authBusy = false; authError = e.message || 'Código inválido'; render();
      }
    });

    on('#btnLogout', 'click', async () => { await window.Sync.signOut(); });

    on('#btnAbrirGrupos', 'click', () => { openOverlay({ type: 'grupos' }); refreshMisGrupos(); });

    on('[data-switch-grupo]', 'click', async (el) => {
      const id = el.getAttribute('data-switch-grupo');
      if (grupoActivo && id === grupoActivo.id) return closeOverlay();
      closeOverlay();
      view = 'loading'; render();
      try { await window.Sync.selectGrupo(id); }
      catch (e) { toast(e.message || 'No se pudo abrir el grupo'); view = 'home'; render(); }
    });

    on('#btnCrearGrupo', 'click', () => openOverlay({ type: 'crearGrupo' }));
    on('#btnUnirseGrupo', 'click', () => openOverlay({ type: 'unirseGrupo', draft: { input: pendingJoinCode || '' } }));
    on('#btnCrearGrupoInline', 'click', () => openOverlay({ type: 'crearGrupo' }));
    on('#btnUnirseGrupoInline', 'click', () => openOverlay({ type: 'unirseGrupo', draft: { input: pendingJoinCode || '' } }));

    on('#btnConfirmarCrearGrupo', 'click', async () => {
      const nombre = (document.getElementById('cgNombre').value || '').trim();
      const moneda = document.getElementById('cgMoneda').value;
      if (!nombre) return toast('Ponele un nombre al grupo');
      try {
        await window.Sync.createGrupo(nombre, moneda);
        closeOverlay();
      } catch (e) { toast(e.message || 'No se pudo crear el grupo'); }
    });

    on('#btnConfirmarUnirse', 'click', async () => {
      const input = (document.getElementById('jgInput').value || '').trim();
      if (!input) return toast('Pegá un link o código');
      try {
        await window.Sync.joinGrupo(input);
        closeOverlay();
      } catch (e) { toast(e.message || 'No se pudo unir al grupo'); }
    });

    on('#btnAjustes', 'click', () => openOverlay({ type: 'ajustes' }));
    on('#btnVerVersiones', 'click', () => openOverlay({ type: 'versiones' }));

    on('#btnActualizar', 'click', async (el) => {
      el.disabled = true;
      // Fuerza la actualización aunque el navegador todavía no haya
      // detectado que sw.js cambió de bytes — borra los caches y desregistra
      // el service worker antes de recargar, en vez de confiar en
      // reg.update() (mismo motivo/técnica que el botón de refresh de
      // lista-super/repartirlalucila).
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
      } catch (e) {}
      location.reload();
    });

    on('#btnToggleTheme', 'click', () => {
      const actual = document.documentElement.getAttribute('data-theme') || 'dark';
      const siguiente = actual === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', siguiente);
      try { localStorage.setItem('bona_consumos_theme', siguiente); } catch (e) {}
      render();
    });
    on('#btnCerrarOverlay', 'click', () => closeOverlay());

    on('#btnGuardarAlias', 'click', async () => {
      const alias = (document.getElementById('aliasInput').value || '').trim();
      try {
        await window.Sync.updateMyDisplayName(alias);
        toast('Alias actualizado');
        render();
      } catch (e) { toast(e.message || 'No se pudo actualizar el alias'); }
    });

    on('#btnCopiarLink', 'click', async () => {
      const link = window.Sync.getShareLink();
      try { await navigator.clipboard.writeText(link); toast('Link copiado'); }
      catch (e) { toast('No se pudo copiar, copialo manual'); }
    });

    on('#btnGuardarNombre', 'click', async () => {
      const nombre = (document.getElementById('renombrarInput').value || '').trim();
      if (!nombre) return toast('El nombre no puede estar vacío');
      try { await window.Sync.renameGrupo(nombre); closeOverlay(); }
      catch (e) { toast(e.message || 'No se pudo renombrar'); }
    });

    on('#btnSalirGrupo', 'click', async () => {
      if (!confirm('¿Salir de este grupo?')) return;
      await window.Sync.leaveGrupo();
      closeOverlay();
    });

    on('#btnEliminarGrupo', 'click', async () => {
      if (!confirm('Esto borra el grupo para todos los miembros. ¿Seguro?')) return;
      try { await window.Sync.deleteGrupo(); closeOverlay(); }
      catch (e) { toast(e.message || 'No se pudo eliminar'); }
    });

    on('[data-filtro-cat]', 'click', (el) => {
      filtroCategoria = el.getAttribute('data-filtro-cat') || null;
      render();
    });

    on('#btnCargarGasto', 'click', () => openOverlay({ type: 'gasto', editId: null, draft: nuevoDraftGasto(null) }));
    on('[data-edit-gasto]', 'click', (el) => {
      const g = gastos.find((x) => x.id === el.getAttribute('data-edit-gasto'));
      if (g) openOverlay({ type: 'gasto', editId: g.id, draft: nuevoDraftGasto(g) });
    });

    on('#btnNuevaCategoria', 'click', (el, ev) => {
      ev.preventDefault();
      openOverlay({ type: 'nuevaCategoria', prevOverlay: overlay, draft: { nombre: '', icono: 'dots' } });
    });
    on('#nuevaCatInput', 'input', (el) => {
      if (!overlay || overlay.type !== 'nuevaCategoria') return;
      overlay.draft.nombre = el.value;
    });
    on('[data-set-nueva-cat-icono]', 'click', (el) => {
      if (!overlay || overlay.type !== 'nuevaCategoria') return;
      overlay.draft.icono = el.getAttribute('data-set-nueva-cat-icono');
      render();
    });
    on('#btnConfirmarNuevaCategoria', 'click', async () => {
      const nombre = (overlay.draft.nombre || '').trim();
      if (!nombre) return toast('Ponele un nombre');
      try {
        // addCategoriaCustom ya espera a pullNow() internamente, así que
        // categoriasCustom llega actualizado (vía onRemoteData) antes de
        // este punto — no hace falta (ni conviene, duplicaría la entrada)
        // empujarla acá también.
        await window.Sync.addCategoriaCustom(nombre, overlay.draft.icono);
        overlay = overlay.prevOverlay;
        overlay.draft.categoria = nombre;
        overlay.draft.descripcion = nombre;
        render();
      } catch (e) { toast(e.message || 'No se pudo agregar'); }
    });

    // Formulario de gasto: cualquier cambio recalcula el draft en memoria y
    // vuelve a pintar el overlay (patrón controlado simple, sin librería de
    // formularios).
    onGastoField('#gMonto', 'input', (v, d) => { d.monto = v; });
    onGastoField('#gMoneda', 'change', (v, d) => {
      d.moneda = v;
      // Sugerir la última tasa usada en el grupo para esta moneda, si hay
      // algún gasto previo cargado así — evita que el usuario tenga que
      // buscar la cotización de nuevo cada vez (el spec pide esto
      // explícitamente en vez de integrar una API de cotizaciones).
      if (v !== grupoActivo.monedaBase && !d.tasaCambio) {
        const previo = gastos.find((g) => g.moneda === v && g.tasaCambio != null);
        if (previo) d.tasaCambio = previo.tasaCambio;
      }
    });
    onGastoField('#gTasa', 'input', (v, d) => { d.tasaCambio = v; });
    onGastoField('#gDescripcion', 'input', (v, d) => { d.descripcion = v; });
    onGastoField('#gPagador', 'change', (v, d) => { d.pagadoPor = v; });
    onGastoField('#gFecha', 'change', (v, d) => { d.fecha = v; });
    onGastoField('#gNotas', 'input', (v, d) => { d.notas = v; });

    on('[data-set-categoria]', 'click', (el) => {
      if (!overlay || overlay.type !== 'gasto') return;
      const categoria = el.getAttribute('data-set-categoria');
      overlay.draft.categoria = categoria;
      overlay.draft.descripcion = categoria;
      render();
    });

    on('[data-set-modo]', 'click', (el) => {
      if (!overlay || overlay.type !== 'gasto') return;
      overlay.draft.modo = el.getAttribute('data-set-modo');
      render();
    });

    on('[data-toggle-participante]', 'click', (el) => {
      if (!overlay || overlay.type !== 'gasto') return;
      const id = el.getAttribute('data-toggle-participante');
      const d = overlay.draft;
      if (d.participantes.includes(id)) d.participantes = d.participantes.filter((x) => x !== id);
      else d.participantes.push(id);
      render();
    });

    on('[data-valor-participante]', 'input', (el) => {
      if (!overlay || overlay.type !== 'gasto') return;
      overlay.draft.valores[el.getAttribute('data-valor-participante')] = el.value;
    });

    on('#btnGuardarGasto', 'click', async () => {
      if (!overlay || overlay.type !== 'gasto') return;
      const d = overlay.draft;
      d.error = '';
      const monto = Number(d.monto);
      if (!monto || monto <= 0) { d.error = 'Ingresá un monto válido'; return render(); }
      if (!d.descripcion.trim()) { d.error = 'Ingresá una descripción'; return render(); }
      if (!d.participantes.length) { d.error = 'Elegí al menos un participante'; return render(); }

      const necesitaTasa = d.moneda !== grupoActivo.monedaBase;
      const tasa = necesitaTasa ? Number(d.tasaCambio) : 1;
      if (necesitaTasa && (!tasa || tasa <= 0)) { d.error = 'Ingresá una tasa de cambio válida'; return render(); }
      const montoBase = L.round2(monto * tasa);

      let shares;
      try {
        if (d.modo === 'igual') {
          shares = L.calcularShares(montoBase, 'igual', d.participantes.map((id) => ({ usuarioId: id })));
        } else if (d.modo === 'monto_fijo') {
          const participantes = d.participantes.map((id) => ({ usuarioId: id, valor: Number(d.valores[id]) || 0 }));
          const sumaOriginal = participantes.reduce((a, p) => a + p.valor, 0);
          if (Math.abs(L.round2(sumaOriginal) - L.round2(monto)) > 0.01) {
            throw new Error(`Los montos suman ${L.round2(sumaOriginal)}, tienen que sumar ${L.round2(monto)}`);
          }
          // No pasa por Logic.calcularShares: convertir cada monto fijo por
          // separado y redondearlo puede desviar la suma total unos
          // centavos respecto a montoBase cuando hay tasa de cambio de por
          // medio (el redondeo no es lineal). En vez de repetir la
          // validación estricta de suma-exacta con ese riesgo, el último
          // participante absorbe la diferencia — mismo criterio que
          // splitByWeights (método de Hamilton) usa para porcentaje/shares.
          let acumulado = 0;
          shares = participantes.map((p, i) => {
            const esUltimo = i === participantes.length - 1;
            const montoBaseItem = esUltimo ? L.round2(montoBase - acumulado) : L.round2(p.valor * tasa);
            acumulado = L.round2(acumulado + montoBaseItem);
            return { usuarioId: p.usuarioId, tipoSplit: 'monto_fijo', valor: L.round2(p.valor), montoBase: montoBaseItem };
          });
        } else {
          const participantes = d.participantes.map((id) => ({ usuarioId: id, valor: Number(d.valores[id]) || 0 }));
          shares = L.calcularShares(montoBase, d.modo, participantes);
        }
      } catch (e) {
        d.error = e.message; return render();
      }

      const gasto = {
        id: overlay.editId || uid(),
        descripcion: d.descripcion.trim(),
        monto, moneda: d.moneda,
        tasaCambio: necesitaTasa ? tasa : null,
        montoBase,
        categoria: d.categoria,
        pagadoPor: d.pagadoPor,
        fecha: d.fecha,
        notas: d.notas.trim(),
        shares,
      };

      try {
        await window.Sync.saveGasto(gasto);
        closeOverlay();
      } catch (e) { d.error = e.message || 'No se pudo guardar'; render(); }
    });

    on('#btnEliminarGasto', 'click', async () => {
      if (!overlay || !overlay.editId) return;
      if (!confirm('¿Eliminar este gasto?')) return;
      try { await window.Sync.deleteGasto(overlay.editId); closeOverlay(); }
      catch (e) { toast(e.message || 'No se pudo eliminar'); }
    });

    on('[data-settle-idx]', 'click', (el) => {
      const balances = L.calcularBalances({
        gastos: gastos.map((g) => ({ pagadoPor: g.pagadoPor, montoBase: g.montoBase })),
        shares: gastos.flatMap((g) => g.shares),
        settlements: settlements.map((s) => ({ deUsuarioId: s.deUsuarioId, aUsuarioId: s.aUsuarioId, monto: s.monto })),
      });
      const t = L.simplificarDeudas(balances)[Number(el.getAttribute('data-settle-idx'))];
      if (!t) return;
      openOverlay({
        type: 'settle',
        draft: { deUsuarioId: t.deUsuarioId, aUsuarioId: t.aUsuarioId, monto: t.monto, fecha: todayIso(), nota: '', error: '' },
      });
    });

    on('#btnConfirmarSettle', 'click', async () => {
      const de = document.getElementById('stDe').value;
      const a = document.getElementById('stA').value;
      const monto = Number(document.getElementById('stMonto').value);
      const fecha = document.getElementById('stFecha').value;
      const nota = document.getElementById('stNota').value;
      if (de === a) return toast('Elegí dos personas distintas');
      if (!monto || monto <= 0) return toast('Ingresá un monto válido');
      try {
        await window.Sync.saveSettlement({
          id: uid(), deUsuarioId: de, aUsuarioId: a, monto, moneda: grupoActivo.monedaBase, fecha, nota,
        });
        closeOverlay();
      } catch (e) { toast(e.message || 'No se pudo guardar'); }
    });

    function on(selector, evt, handler) {
      app.querySelectorAll(selector).forEach((el) => el.addEventListener(evt, (ev) => handler(el, ev)));
      document.getElementById('overlayBody').querySelectorAll(selector).forEach((el) => el.addEventListener(evt, (ev) => handler(el, ev)));
    }

    function onGastoField(selector, evt, apply) {
      on(selector, evt, (el) => {
        if (!overlay || overlay.type !== 'gasto') return;
        apply(el.value, overlay.draft);
        // Los campos de texto libre no necesitan re-render completo salvo
        // que dependan de otro (monto/tasa recalculan el hint de conversión).
        if (selector === '#gMonto' || selector === '#gTasa' || selector === '#gMoneda') render();
      });
    }
  }

  // ---- Carga de "mis grupos" (para el overlay switcher) ----
  // autoPickIfNone: se usa solo en el arranque post-login — si no hay un
  // grupo guardado localmente (usuario nuevo en este dispositivo) pero sí
  // pertenece a alguno ya existente (creado desde otro dispositivo), lo
  // elegimos automáticamente en vez de mostrar el estado vacío.
  async function refreshMisGrupos({ autoPickIfNone = false } = {}) {
    misGruposLoaded = false; render();
    try {
      misGrupos = await window.Sync.listMyGrupos();
    } catch (e) {
      toast(e.message || 'No se pudieron cargar tus grupos');
      misGrupos = [];
    }
    misGruposLoaded = true;
    if (autoPickIfNone && !window.Sync.getGrupoId() && misGrupos.length) {
      window.Sync.selectGrupo(misGrupos[0].id).catch((e) => toast(e.message || 'No se pudo abrir el grupo'));
    } else if (view === 'loading' && !window.Sync.getGrupoId()) {
      // Ni grupo guardado ni grupos para auto-elegir: usuario nuevo sin
      // ningún grupo todavía — mostramos el estado vacío de home.
      view = 'home';
    }
    render();
  }

  // ---- Wiring con Sync ----
  window.Sync.init({
    onAuthChange(u) {
      user = u;
      if (u) {
        if (view === 'auth' || view === 'loading') {
          view = 'loading';
          if (pendingJoinCode) {
            const code = pendingJoinCode; pendingJoinCode = null;
            window.Sync.joinGrupo(code).catch((e) => {
              toast(e.message || 'No se pudo unir al grupo');
              view = 'home'; render();
            });
          } else {
            refreshMisGrupos({ autoPickIfNone: true });
          }
        }
      } else {
        view = 'auth'; authStep = 'email'; authEmail = ''; authError = '';
      }
      render();
    },
    onGrupoChange(info) {
      grupoActivo = info;
      view = 'home';
      render();
    },
    onRemoteData(state) {
      gastos = state.gastos;
      settlements = state.settlements;
      categoriasCustom = state.categoriasCustom;
      miembros = state.miembros;
      render();
    },
    onMembersChange(list) {
      miembros = list;
      render();
    },
    onSyncError(msg) {
      toast(msg);
    },
  });

  // El backdrop es un elemento estático fuera de #app/#overlayBody — no se
  // destruye en cada render(), así que este listener se cablea una sola vez
  // acá, no dentro de wireEvents(). Tocar el fondo vacío cierra el overlay
  // igual que la ✕ (mismo closeOverlay(), respeta el caso especial de
  // "nueva categoría" volviendo al gasto en progreso).
  document.getElementById('overlayBackdrop').addEventListener('click', closeOverlay);

  if (!window.Sync.isConfigured()) {
    document.getElementById('app').innerHTML = `<div class="empty-state">Falta configurar Supabase en config.js</div>`;
  } else {
    pendingJoinCode = window.Sync.pendingJoinCodeFromUrl();
    view = 'loading';
    render();
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
